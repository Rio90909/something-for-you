*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#150829}
body{font-family:'Jost',system-ui,sans-serif;color:#f6e7c8}
#stage{position:relative;width:100%;height:100dvh;overflow:hidden;
  background:linear-gradient(180deg,#150829 0%,#22103e 34%,#3a1849 58%,#571f45 76%,#2a0f33 100%)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* slim crescent moon, pure CSS: gold disc + a sky-coloured disc cutting into it */
.moon{position:absolute;top:12px;left:16px;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fff6d8 0%,#f7d774 45%,#e0a83c 100%);opacity:.95;pointer-events:none}
.moon::after{content:"";position:absolute;top:-3px;left:11px;width:33px;height:33px;border-radius:50%;
  background:#1d0e36}
/* rose-garden silhouette along the bottom: layered dark SVG hills + bushes */
.garden{position:absolute;left:0;right:0;bottom:0;width:100%;height:132px;pointer-events:none}
header{position:absolute;top:0;left:0;right:0;text-align:center;padding:26px 20px 0;pointer-events:none;z-index:3;transition:opacity .8s}
header.dim{opacity:0}
.kicker{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#d9b45c;opacity:.9}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:34px;line-height:1.08;color:#f8ecc9;margin-top:8px}
.whisper{font-family:'Great Vibes',cursive;font-size:27px;color:#f3c96b;margin-top:6px}
#tapHint{position:absolute;left:0;right:0;top:47%;text-align:center;font-size:13px;letter-spacing:.18em;
  text-transform:uppercase;color:#e8d5a8;opacity:.85;transition:opacity .6s;pointer-events:none;z-index:3}
#tapHint b{color:#ffd97a;font-weight:500}
#princessName{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:'Great Vibes',cursive;
  font-size:52px;color:#ff9ebb;text-shadow:0 0 14px rgba(255,158,187,.42),0 0 3px rgba(255,158,187,.30);
  opacity:0;transform:translateY(8px);transition:opacity 1.1s,transform 1.1s;
  pointer-events:none;z-index:3}
#princessName.show{opacity:1;transform:translateY(0)}
#letterLine{position:absolute;left:0;right:0;top:44%;padding:0 34px;text-align:center;font-family:'Great Vibes',cursive;
  font-size:30px;line-height:1.35;color:#f7dd9a;opacity:0;transform:translateY(10px);
  transition:opacity 1.4s,transform 1.4s;pointer-events:none;z-index:3}
#letterLine.show{opacity:1;transform:translateY(0)}
#turnHint{position:absolute;left:0;right:0;top:63%;text-align:center;font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:#e8d5a8;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:3}
#turnHint.show{opacity:.9}
#finaleBtn{position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:4;
  font-family:'Jost',sans-serif;font-size:14px;letter-spacing:.24em;text-transform:uppercase;
  color:#2a1200;background:linear-gradient(180deg,#ffe9a8,#e9b64a);border:1px solid #ffedb8;border-radius:999px;
  padding:14px 26px;cursor:pointer;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .9s,transform .9s}
#finaleBtn.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#musicBtn{position:absolute;top:16px;right:16px;z-index:5;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(247,215,116,.55);background:rgba(21,8,41,.45);color:#f7d774;font-size:17px;line-height:1;
  cursor:pointer}
#musicBtn.muted{opacity:.55}
#musicBtn.muted::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:1.5px;background:#f7d774;
  transform:rotate(-45deg)}
#replayBtn{position:absolute;right:16px;top:118px;z-index:5;background:none;border:0;color:#d9c48f;
  font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.14em;cursor:pointer;opacity:.85;padding:8px}
@media (max-width:359px){h1{font-size:30px}.whisper{font-size:24px}#princessName{font-size:44px}#letterLine{font-size:26px}}

#cakeWrap{position:absolute;left:50%;bottom:44px;width:200px;z-index:2;perspective:700px;
  transform:translate(-50%,112%);opacity:0;transition:transform 1.2s ease,opacity 1.2s ease;pointer-events:none}
#cakeWrap.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#cake{position:relative;width:100%}
.cakePhoto{position:relative;width:100%;aspect-ratio:500/640;background-image:var(--cakeImg);
  background-size:100% 100%;background-repeat:no-repeat;
  -webkit-mask-image:radial-gradient(ellipse 84% 78% at 50% 50%,#000 55%,transparent 92%);
  mask-image:radial-gradient(ellipse 84% 78% at 50% 50%,#000 55%,transparent 92%)}
/* candle flames: positions measured from the photo with PIL (bright-flame centroids):
   (16.3%,26.1%) (41.6%,8.6%) (50.7%,15.8%) (65.9%,11.5%) (79.0%,31.4%) */
.cflame{position:absolute;width:12px;height:18px;margin-left:-6px;margin-top:-9px;z-index:5;pointer-events:none}
.cflame .cap{position:absolute;left:50%;top:50%;width:12px;height:20px;margin-left:-6px;margin-top:-10px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(58,40,24,.92) 0%,rgba(58,40,24,.55) 55%,rgba(58,40,24,0) 78%);
  opacity:0;transition:opacity .3s}
.cflame:not(.lit) .cap{opacity:1}
.cflame .halo{position:absolute;left:50%;top:55%;width:34px;height:34px;margin-left:-17px;margin-top:-17px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,205,110,.75),rgba(255,180,60,.28) 45%,rgba(255,180,60,0) 70%);opacity:0;transition:opacity .3s}
.cflame .fl{position:absolute;left:0;top:0;width:12px;height:18px;
  background:radial-gradient(ellipse 45% 62% at 50% 65%,#fff6c9 0%,#ffcf5e 45%,#ff9d2e 78%,#ff7a1a 100%);
  border-radius:50% 50% 50% 50%/68% 68% 32% 32%;transform-origin:50% 100%;opacity:0;transition:opacity .3s}
.cflame.lit .fl{opacity:1;animation:flick .22s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.cflame.lit .halo{opacity:.55;animation:haloFlick 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.88,1.16) translateY(-.8px)}}
@keyframes haloFlick{0%,100%{opacity:.35}50%{opacity:.6}}
.cflame .smoke{position:absolute;left:50%;bottom:100%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
  background:rgba(214,214,220,.85);opacity:0;pointer-events:none}
.cflame .smoke.puff{animation:smokeUp .95s ease-out forwards}
@keyframes smokeUp{0%{opacity:.85;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-20px) scale(1.7)}}
/* the photo has 11 prominent flames; only 5 are interactive — the other 6 stay
   capped (unlit wick tips) so a blown-out cake never looks half-burning */
.capOnly{position:absolute;width:12px;height:20px;margin-left:-6px;margin-top:-10px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(58,40,24,.92) 0%,rgba(58,40,24,.55) 55%,rgba(58,40,24,0) 78%);
  z-index:5;pointer-events:none}
/* gold knife: glides down the cut line, then the photo wedge slides out */
#knife{position:absolute;left:62%;top:46.1%;width:2px;height:53.9%;z-index:3;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,#fff3c4,#f7d774 40%,#c9971c);
  transform:translateY(-112%);transition:transform .55s ease-in,opacity .25s ease}
#knife.cutting{opacity:1;transform:translateY(0)}
#knife.done{opacity:0}
/* dark hollow left where the slice came from: pale sponge cut-face on its left edge, shadowed hollow behind */
#cakeGap{position:absolute;right:0;bottom:0;width:38%;height:53.9%;z-index:2;pointer-events:none;
  clip-path:polygon(34% 0,100% 6%,100% 100%,6% 94%);
  background:linear-gradient(180deg,rgba(0,0,0,0) 0 40%,rgba(255,240,220,.5) 40% 48%,rgba(0,0,0,0) 48% 100%),
  linear-gradient(90deg,#f6c3d2 0%,#f2b7c8 20%,#7c2140 24%,#3d0716 62%,#5a1226 100%);opacity:0;transition:opacity .4s}
#cakeGap.show{opacity:1}
/* the slice is a wedge of the SAME photo: same data URI, background aligned so it
   continues the cake pixel-for-pixel (size 263.2%/185.5%, position 100%/100%) */
#sliceEl{position:absolute;right:0;bottom:0;width:38%;height:53.9%;z-index:4;cursor:pointer;
  clip-path:polygon(34% 0,100% 6%,100% 100%,6% 94%);
  background-image:var(--cakeImg);background-size:263.2% 185.5%;background-position:100% 100%;background-repeat:no-repeat;
  opacity:0;transform:translateX(0) rotate(0deg);transform-origin:50% 80%;
  transition:transform .7s cubic-bezier(.22,.9,.3,1),opacity .18s ease;pointer-events:none}
#sliceEl.cut{opacity:1;transform:translateX(48px) rotate(7deg);pointer-events:auto}
#sliceEl.bite1{transform:translateX(48px) rotate(7deg) scale(.72)}
#sliceEl.bite2{transform:translateX(48px) rotate(7deg) scale(.45)}
#sliceEl.gone{opacity:0;transform:translateX(48px) rotate(7deg) scale(.15);pointer-events:none}
.crumb{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:6;
  background:radial-gradient(circle,#fff3c4,#e9b64a 60%,rgba(233,182,74,0));
  animation:crumbFly .7s ease-out forwards}
@keyframes crumbFly{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx,10px),var(--dy,-18px)) scale(.3)}}
#yum{position:absolute;left:0;right:0;top:-38px;text-align:center;font-family:'Great Vibes',cursive;
  font-size:32px;color:#ffd97a;opacity:0;transition:opacity .6s;pointer-events:none;z-index:6}
#yum.show{opacity:1}
#cakeHint{position:absolute;left:-24px;right:-24px;top:calc(100% + 4px);text-align:center;font-size:11px;
  letter-spacing:.14em;line-height:1.7;text-transform:uppercase;color:#e8d5a8;opacity:0;transition:opacity .8s;
  pointer-events:none;padding:0 6px}
#cakeHint.show{opacity:.9}
@media (max-width:359px){#cakeWrap{width:172px}#cakeHint{font-size:10px;letter-spacing:.1em}}
@media (prefers-reduced-motion:reduce){
  .cflame.lit .fl,.cflame.lit .halo{animation:none}
  #cakeWrap{transition:none}
  .crumb{animation:none}
  .cflame .smoke.puff{animation:none}
  #cake{animation:none}
  #petalsFg i{animation:none}
}
/* — V6: 3D photo cake — the cake lives in a perspective stage. Drag it and it
   tilts like you are holding it; petals (near), garden (mid) and moon (far)
   shift at different rates so the scene has real depth. — */
#cake3d{position:relative;transform-style:preserve-3d;will-change:transform}
#cake3d.dragging{transition:none}
#cake3d.easing{transition:transform .45s cubic-bezier(.22,.9,.3,1)}
#cake{animation:cakeSway 7s ease-in-out infinite}
@keyframes cakeSway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
#cakeShadow{position:absolute;left:12%;right:12%;bottom:-8px;height:14px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.45),rgba(0,0,0,0) 70%);
  opacity:.5;pointer-events:none;z-index:1;
  transition:transform .45s cubic-bezier(.22,.9,.3,1),opacity .45s}
#petalsFg{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:3;overflow:hidden}
#petalsFg i{position:absolute;width:12px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 40% 35%,#ffd7e6,#e0508a 70%);opacity:.7;
  animation:petalDrift 9s ease-in-out infinite alternate}
#petalsFg i:nth-child(1){left:6%;bottom:26px}
#petalsFg i:nth-child(2){left:16%;bottom:10px;width:9px;height:7px;animation-delay:-2s}

@keyframes petalDrift{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-10px) rotate(10deg)}}
</style>

<script>
(function(){
"use strict";
/* — admin-editable name: Shaheer can change "Princess" here later (or via the admin panel) — */
const PRINCESS_NAME = "Princess";
const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const cv = document.getElementById('sky');
const ctx = cv.getContext('2d');
const finaleBtn = document.getElementById('finaleBtn');
const tapHint = document.getElementById('tapHint');
const pageHead = document.getElementById('pageHead');
const princessEl = document.getElementById('princessName');
const letterEl = document.getElementById('letterLine');
const turnEl = document.getElementById('turnHint');
const musicBtn = document.getElementById('musicBtn');
const cakeWrap = document.getElementById('cakeWrap');
const cake3d = document.getElementById('cake3d');
const cakeShadow = document.getElementById('cakeShadow');
const gardenEl = document.querySelector('.garden');
const moonEl = document.querySelector('.moon');
const petalsEl = document.getElementById('petalsFg');
const cakeEl = document.getElementById('cake');
const sliceEl = document.getElementById('sliceEl');
const cakeGap = document.getElementById('cakeGap');
const cakeHint = document.getElementById('cakeHint');
const yumEl = document.getElementById('yum');
const candleEls = Array.prototype.slice.call(document.querySelectorAll('.cflame'));
const knifeEl = document.getElementById('knife');

let W = 360, H = 780, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = stage.clientWidth || 360; H = stage.clientHeight || 780;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
}
window.addEventListener('resize', resize);

/* — pre-drawn spark sprites (no blur, no shadowBlur) — */
function sprite(colorA, colorB){
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,'#ffffff'); gr.addColorStop(.25,colorA); gr.addColorStop(.6,colorB); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,32,32);
  return c;
}
const sprGold = sprite('rgba(255,216,130,.95)','rgba(219,164,44,.45)');
const sprRose = sprite('rgba(255,150,175,.95)','rgba(224,80,138,.4)');
const sprWhite = sprite('rgba(255,244,214,.95)','rgba(255,214,120,.4)');
const sprRed = sprite('#ff5a6e','rgba(214,32,64,.45)');
const sprPink = sprite('#ff9ebb','rgba(224,80,138,.4)');

/* — stars: many small, gentle twinkle (opacity only) — */
let stars = [];
function buildStars(){
  stars = [];
  const n = RM ? 30 : 72;
  for (let i = 0; i < n; i++) stars.push({ x: Math.random()*W, y: Math.random()*H*0.66, r: .6 + Math.random()*1.4, ph: Math.random()*6.28, sp: .35 + Math.random()*1.1 });
}
function drawStars(t){
  for (const s of stars){
    const a = .22 + .6 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.sp + s.ph));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffe9b0';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* — fireworks state — */
let act = 1, taps = 0, muted = false, shapeIdx = 0;
let rockets = [], sparks = [], letters = [], flashes = [];
let rafOn = false, lastT = 0;
const SHAPES = ['peony','willow','ring','crackle'];
const MAX_SPARKS = 750;

function launchRocket(x, y, opts){
  opts = opts || {};
  playWhoosh();
  rockets.push({ x: x, y: y + 30, ty: y - (90 + Math.random()*70), vx: (Math.random()-.5)*.6,
    vy: -(7 + Math.random()*2.5), trail: [], gold: opts.gold !== false,
    shape: opts.shape || SHAPES[shapeIdx++ % SHAPES.length], burstN: opts.burstN || 0 });
}

/* Layered burst: gold core + rose secondary + crackling star sparks + gold rain trails. */
function burst(x, y, shape, gold){
  const coreN = RM ? 34 : 88, secN = RM ? 18 : 48, crkN = RM ? 12 : 36;
  const coreSpr = gold ? sprGold : sprRose, secSpr = gold ? sprRose : sprGold;
  function push(s){ sparks.push(s); if (sparks.length > MAX_SPARKS) sparks.splice(0, sparks.length - MAX_SPARKS); }
  /* gold core */
  for (let i = 0; i < coreN; i++){
    let a, sp;
    if (shape === 'ring'){ a = (i / coreN) * 6.283; sp = 3.4 + Math.random()*.4; }
    else if (shape === 'willow'){ a = Math.random()*6.283; sp = 1.4 + Math.random()*2.6; }
    else { a = Math.random()*6.283; sp = 1.4 + Math.random()*4.0; }
    push({ x:x, y:y, px:x, py:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - .6, life:1,
      decay: shape === 'willow' ? .004 + Math.random()*.005 : .008 + Math.random()*.014,
      s: 6.5 + Math.random()*7, spr: coreSpr, grav: shape === 'willow' ? .075 : .035,
      drag: .985, trail: shape === 'willow', jit: shape === 'crackle' });
  }
  /* rose secondary, slightly slower, offset angles */
  for (let i = 0; i < secN; i++){
    const a = Math.random()*6.283, sp = .8 + Math.random()*2.2;
    push({ x:x, y:y, px:x, py:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - .4, life:1,
      decay:.01 + Math.random()*.012, s: 5 + Math.random()*6, spr: secSpr, grav:.03, drag:.982, trail:false, jit:false });
  }
  /* crackling star sparks: tiny, bright, jittering */
  for (let i = 0; i < crkN; i++){
    const a = Math.random()*6.283, sp = 2 + Math.random()*3.4;
    push({ x:x, y:y, px:x, py:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1,
      decay:.02 + Math.random()*.02, s: 3.5 + Math.random()*3.5, spr: sprWhite, grav:.02, drag:.97, trail:false, jit:true });
  }
  /* gold rain trails (willow droop): slow falling gold drops */
  if (shape === 'willow'){
    for (let i = 0; i < 22; i++){
      push({ x: x + (Math.random()-.5)*70, y: y + (Math.random()-.5)*30, px:0, py:0,
        vx:(Math.random()-.5)*.4, vy: .9 + Math.random()*1.1, life:1, decay:.006 + Math.random()*.005,
        s: 4 + Math.random()*4, spr: sprGold, grav:.05, drag:.995, trail:true, jit:false });
    }
  }
}

function tick(t){
  if (!rafOn) return;
  const dt = Math.min(50, t - lastT || 16); lastT = t;
  ctx.clearRect(0, 0, W, H);
  drawStars(t);
  /* rockets */
  for (let i = rockets.length - 1; i >= 0; i--){
    const r = rockets[i];
    r.trail.push({ x: r.x, y: r.y }); if (r.trail.length > 9) r.trail.shift();
    r.x += r.vx; r.y += r.vy; r.vy += .06;
    ctx.globalAlpha = .85;
    for (let j = 0; j < r.trail.length; j++){
      const p = r.trail[j], k = j / r.trail.length;
      ctx.drawImage(r.gold ? sprGold : sprRose, p.x - 4*k - 2, p.y - 4*k - 2, 8*k + 2, 8*k + 2);
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(r.gold ? sprGold : sprRose, r.x - 6, r.y - 6, 12, 12);
    if (r.y <= r.ty || r.vy >= 0){
      rockets.splice(i, 1);
      burst(r.x, r.y, r.shape, r.gold);
      flashes.push({ x: r.x, y: r.y, life: 1 });
      playBoom();
      if (r.shape === 'crackle' || r.shape === 'willow') setTimeout(playCrackle, 200);
    }
  }
  /* core flash: bright white bloom at each burst, fading fast */
  for (let i = flashes.length - 1; i >= 0; i--){
    const f = flashes[i];
    f.life -= dt * .005;
    if (f.life <= 0){ flashes.splice(i, 1); continue; }
    ctx.globalAlpha = f.life * .9;
    const fs = 26 + (1 - f.life) * 44;
    ctx.drawImage(sprWhite, f.x - fs, f.y - fs, fs*2, fs*2);
  }
  ctx.globalAlpha = 1;
  /* sparks */
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.px = s.x; s.py = s.y;
    if (s.jit){ s.vx += (Math.random()-.5)*.5; s.vy += (Math.random()-.5)*.5; }
    s.x += s.vx; s.y += s.vy; s.vy += s.grav; s.vx *= s.drag; s.vy *= s.drag; s.life -= s.decay;
    if (s.life <= 0){ sparks.splice(i, 1); continue; }
    const a = Math.max(0, s.life);
    if (s.trail){
      ctx.globalAlpha = a * .55; ctx.strokeStyle = '#ffd97a'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(s.px, s.py); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
    ctx.globalAlpha = a;
    ctx.drawImage(s.spr, s.x - s.s, s.y - s.s, s.s*2, s.s*2);
  }
  ctx.globalAlpha = 1;
  /* sky letters — glow pass (big faint sprite, opacity pulse) + bright core */
  for (let i = letters.length - 1; i >= 0; i--){
    const p = letters[i];
    if (p.state === 0){
      p.vx += (p.tx - p.x) * .024; p.vy += (p.ty - p.y) * .024;
      p.vx *= .86; p.vy *= .86; p.x += p.vx; p.y += p.vy;
      if (Math.abs(p.tx - p.x) < 3 && Math.abs(p.ty - p.y) < 3){ p.state = 1; p.x = p.tx; p.y = p.ty; }
    } else if (p.state === 1){
      p.a = .85 + .15 * Math.sin(t * .003 + p.ph);
    } else {
      p.vy += .03; p.y += p.vy; p.a -= .012;
      if (p.a <= 0){ letters.splice(i, 1); continue; }
    }
    const pulse = .16 + .10 * (0.5 + 0.5 * Math.sin(t * .0022 + p.ph));
    const lSpr = p.spr || sprRed;
    if (p.state === 1){ ctx.globalAlpha = pulse; ctx.drawImage(lSpr, p.x - p.s*2.4, p.y - p.s*2.4, p.s*4.8, p.s*4.8); }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.a));

let audioPlays = { whoosh: 0, boom: 0, crackle: 0 };
const sfxAudios = [];
function makePool(uri, n){
  const pool = [];
  for (let i = 0; i < n; i++){ const a = new Audio(uri); a.preload = 'auto'; pool.push(a); sfxAudios.push(a); }
  let idx = 0;
  return function(vol){
    if (muted) return;
    const a = pool[idx++ % pool.length];
    try{
      a.volume = vol; a.currentTime = 0;
      const pr = a.play(); if (pr && pr.catch) pr.catch(function(){});
    }catch(e){}
  };
}
const playWhooshSnd = makePool(WHOOSH_URI, 4);
const playBoomSnd = makePool(BOOM_URI, 4);
const playCrackleSnd = makePool(CRACKLE_URI, 2);
function playWhoosh(){ audioPlays.whoosh++; playWhooshSnd(.5); }
function playBoom(){ audioPlays.boom++; playBoomSnd(.85); }
function playCrackle(){ audioPlays.crackle++; playCrackleSnd(.9); }
function setSfxMuted(m){ sfxAudios.forEach(function(a){ a.muted = m; if (m){ try{ a.pause(); }catch(e){} } }); }
function sliceSound(){
  if (muted) return;
  try{
    ac();
    const t = actx.currentTime;
    const src = actx.createBufferSource(); src.buffer = getNoise();
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(1400, t); bp.frequency.exponentialRampToValueAtTime(320, t + .22);
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + .28);
    src.connect(bp); bp.connect(g); g.connect(musicGain); src.start(t); src.stop(t + .3);
  }catch(e){}
}
function chime(){
  if (muted) return;
  try{ ac(); const t = actx.currentTime + .05; boxNote(NOTE.E5, t, .8); boxNote(NOTE.C6, t + .22, 1.1); }catch(e){}
}

/* — sky letters: denser resampling, bigger dots, glow pass in tick() — */
function sampleLetters(){
  const twoLine = W < 430; /* two lines up to 430px so the letters stay large and crisp */
  const lines = twoLine ? ['HAPPY', 'BIRTHDAY'] : ['HAPPY BIRTHDAY'];
  const off = document.createElement('canvas');
  off.width = W; off.height = Math.round(H * .5);
  const g = off.getContext('2d');
  let fs = twoLine ? 64 : 44;
  g.font = '600 ' + fs + 'px "Playfair Display", serif';
  let widest = 0;
  lines.forEach(function(l){ widest = Math.max(widest, g.measureText(l).width); });
  if (widest > W - 44){ fs = Math.floor(fs * (W - 44) / widest); g.font = '600 ' + fs + 'px "Playfair Display", serif'; }
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const cy = twoLine ? H * .22 : H * .26;
  if (twoLine){ g.fillText(lines[0], W/2, cy); g.fillText(lines[1], W/2, cy + fs * 1.08); }
  else g.fillText(lines[0], W/2, cy);
  const data = g.getImageData(0, 0, off.width, off.height).data;
  /* denser resampling: step down until the letters hold ~180+ sparks (cap 220) */
  let pts = [];
  for (const step of [5, 4, 3]){
    pts = [];
    for (let y = 0; y < off.height; y += step){
      for (let x = 0; x < off.width; x += step){
        if (data[(y * off.width + x) * 4 + 3] > 120) pts.push({ x: x, y: y });
      }
    }
    if (pts.length >= 180 || step === 3) break;
  }
  /* cap at 220, evenly strided so the letters stay whole and dense */
  if (pts.length <= 220) return pts;
  const out = [], stride = pts.length / 220;
  for (let i = 0; i < 220; i++) out.push(pts[Math.floor(i * stride)]);
  return out;
}

/* — acts — */
let letterPts = [], letterIdx = 0, shellTimer = null, melodyTimers = [], cascadeTimers = [];
function setAct(n){ act = n; stage.setAttribute('data-act', String(n)); }

function startFinale(){
  if (act !== 1) return;
  setAct(2);
  finaleBtn.classList.remove('show');
  tapHint.style.opacity = '0';
  pageHead.classList.add('dim');
  cakeWrap.classList.add('show');
  cakeHint.textContent = 'Touch a candle to blow it out \u2014 touch again to light it';
  cakeHint.classList.add('show');
  letterPts = sampleLetters(); letterIdx = 0;
  try{ ac(); if (musicGain) musicGain.gain.value = muted ? 0 : 1; }catch(e){}
  /* the early loop stops here so the finale melody starts clean on beat one */
  stopMusicLoop();
  const t0 = actx ? actx.currentTime + .1 : 0;
  const res = scheduleMelody(t0);
  const onsets = res.onsets, total = res.total;
  /* once the finale melody ends, the gentle loop takes over for the landing */
  melodyTimers.push(setTimeout(function(){ startMusicLoop(); }, total * 1000 + 200));
  /* shells in rhythm with the melody */
  shellTimer = setInterval(function(){
    launchRocket(40 + Math.random()*(W-80), H * (.30 + Math.random()*.25), { gold: Math.random() < .7 });
  }, 420);
  /* letter sparks fly in during the final phrase (last ~6 notes) */
  const finalStart = onsets[onsets.length - 6];
  const batch = Math.ceil(letterPts.length / 6);
  for (let k = 0; k < 6; k++){
    melodyTimers.push(setTimeout(function(){
      const end = Math.min(letterPts.length, letterIdx + batch);
      for (; letterIdx < end; letterIdx++){
        const p = letterPts[letterIdx];
        letters.push({ x: 30 + Math.random()*(W-60), y: H * (.12 + Math.random()*.3), vx: 0, vy: 0, tx: p.x, ty: p.y, s: 6.5 + Math.random()*3.5, a: .95, ph: Math.random()*6.28, state: 0, spr: (letterIdx % 2 === 0 ? sprRed : sprPink) });
      }
    }, Math.max(0, (finalStart + k * .42 - (actx ? actx.currentTime : 0)) * 1000)));
  }
  /* GRAND CASCADE — several shells in quick succession as the melody ends */
  melodyTimers.push(setTimeout(function(){
    if (shellTimer){ clearInterval(shellTimer); shellTimer = null; }
    for (let k = 0; k < 9; k++){
      cascadeTimers.push(setTimeout(function(){
        launchRocket(36 + (k % 3) * (W-72)/2 + (Math.random()-.5)*30, H * (.28 + Math.random()*.22), { gold: k % 2 === 0 });
      }, k * 150));
    }
    cascadeTimers.push(setTimeout(function(){
      launchRocket(W * .5, H * .30, { gold: true });
      launchRocket(W * .22, H * .34, { gold: false });
      launchRocket(W * .78, H * .34, { gold: false });
      launchRocket(W * .08, H * .38, { gold: true });
      launchRocket(W * .92, H * .38, { gold: true });
      setTimeout(playCrackle, 250); setTimeout(playCrackle, 650);
    }, 9 * 150 + 120));
  }, total * 1000));
  /* candles light in rhythm: first four across the final phrase, last on the final note */
  for (let k = 0; k < 4; k++){
    melodyTimers.push(setTimeout(function(){ lightCandle(k); },
      Math.max(0, (finalStart + k * .42 - (actx ? actx.currentTime : 0)) * 1000)));
  }
  melodyTimers.push(setTimeout(function(){ lightCandle(4); }, total * 1000));

  melodyTimers.push(setTimeout(function(){
    princessEl.textContent = PRINCESS_NAME;
    princessEl.classList.add('show');
  }, total * 1000 + 900));
  melodyTimers.push(setTimeout(startAct3, total * 1000 + 3600));
}
/* — V5 cake: real photo, tap candles on/off, knife cut, photo wedge slice — */
let cakeCut = false, bites = 0, yumTimer = null;
const candleState = [false, false, false, false, false];
function lightSound(){
  if (muted) return;
  try{
    ac(); const t = actx.currentTime + .02;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = 1567.98;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + .5);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + .55);
  }catch(e){}
}
function puffSound(){
  if (muted) return;
  try{
    ac(); const t = actx.currentTime;
    const src = actx.createBufferSource(); src.buffer = getNoise();
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const g = actx.createGain();
    g.gain.setValueAtTime(.09, t); g.gain.exponentialRampToValueAtTime(.0001, t + .28);
    src.connect(lp); lp.connect(g); g.connect(musicGain); src.start(t); src.stop(t + .3);
  }catch(e){}
}
function lightCandle(i){
  const c = candleEls[i];
  if (!c || candleState[i]) return;
  candleState[i] = true; c.classList.add('lit'); lightSound();
}
function blowCandle(i){
  const c = candleEls[i];
  if (!c || !candleState[i]) return;
  candleState[i] = false; c.classList.remove('lit'); puffSound();
  const sm = c.querySelector('.smoke');
  if (sm){ sm.classList.remove('puff'); void sm.offsetWidth; sm.classList.add('puff'); }
}
function toggleCandle(i){ if (candleState[i]) blowCandle(i); else lightCandle(i); }
/* candle taps: one handler on the cake, nearest-flame wins. (Separate tap-zone
   buttons cannot work here — at 172px wide the middle flames sit ~16px apart,
   so any generous zone covers its neighbour's flame.) */
const CANDLE_POS = [[16.3,26.1],[41.6,8.6],[50.7,15.8],[65.9,11.5],[79.0,31.4]];

}
function cutCake(){
  if (cakeCut || !cakeWrap.classList.contains('show')) return;
  cakeCut = true;
  sliceSound();
  knifeEl.classList.add('cutting');
  setTimeout(function(){
    knifeEl.classList.remove('cutting'); knifeEl.classList.add('done');
    cakeGap.classList.add('show');
    sliceEl.classList.add('cut');
    cakeHint.textContent = 'Tap the slice to eat it';
  }, 620);
}
function eatSlice(e){
  if (!cakeCut || bites >= 3) return;
  bites++;
  const r = sliceEl.getBoundingClientRect();
  const x = (e && e.clientX ? e.clientX - r.left : r.width / 2);
  const y = (e && e.clientY ? e.clientY - r.top : r.height / 2);
  crumbBurst(x, y);
  if (bites === 1) sliceEl.classList.add('bite1');
  else if (bites === 2) sliceEl.classList.add('bite2');
  else {
    sliceEl.classList.add('gone');
    yumEl.classList.add('show');
    cakeHint.textContent = 'A slice for you';
    if (yumTimer) clearTimeout(yumTimer);
    yumTimer = setTimeout(function(){ yumEl.classList.remove('show'); }, 1800);
    setTimeout(function(){ cakeHint.classList.remove('show'); }, 2600);
  }
}
/* — V6: 3D photo cake — drag it and it tilts like you are holding it in your
   hands; petals, garden and moon shift at different rates (parallax).
   A tap (no drag) never tilts; a drag starting on a candle never tilts. — */
let tilt = { x: 0, y: 0 }, dragId = null, dragStart = null, dragMoved = false,
    dragOnCandle = false, suppressCakeClick = false;
function applyTilt(rx, ry){
  cake3d.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
  const mag = Math.min(1, (Math.abs(rx) + Math.abs(ry)) / 14);
  cakeShadow.style.transform = 'scale(' + (1 + mag * .12).toFixed(3) + ',' + (1 - mag * .18).toFixed(3) + ')';
  cakeShadow.style.opacity = (0.5 - mag * .18).toFixed(2);
  const px = ry * -0.5, py = rx * 0.35;
  gardenEl.style.transform = 'translate(' + (px * 0.7).toFixed(1) + 'px,' + (py * 0.5).toFixed(1) + 'px)';
  moonEl.style.transform = 'translate(' + (px * 0.3).toFixed(1) + 'px,' + (py * 0.2).toFixed(1) + 'px)';
  petalsEl.style.transform = 'translate(' + (px * 1.5).toFixed(1) + 'px,' + (py * 1.0).toFixed(1) + 'px)';
}
function setPlxTransition(on){
  [gardenEl, moonEl, petalsEl].forEach(function(el){ el.style.transition = on ? 'transform .5s cubic-bezier(.22,.9,.3,1)' : 'none'; });
}
function endTilt(){
  if (dragId === null) return;
  dragId = null;
  cake3d.classList.remove('dragging'); cake3d.classList.add('easing');
  setPlxTransition(true);
  tilt.x = 0; tilt.y = 0; applyTilt(0, 0);
  setTimeout(function(){ cake3d.classList.remove('easing'); }, 500);
}
function cakePointPct(e){
  const r = cakeEl.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * 100, y: (e.clientY - r.top) / r.height * 100 };
}
function nearCandlePct(p){
  for (let i = 0; i < CANDLE_POS.length; i++){
    const dx = p.x - CANDLE_POS[i][0], dy = p.y - (CANDLE_POS[i][1] + 5.5);
    if ((dx/17)*(dx/17) + (dy/14)*(dy/14) < 1) return true;
  }
  return false;
}
cake3d.addEventListener('pointerdown', function(e){
  if (act !== 2 && act !== 3) return;
  if (!cakeWrap.classList.contains('show')) return;
  dragOnCandle = nearCandlePct(cakePointPct(e));
  dragId = e.pointerId; dragStart = { x: e.clientX, y: e.clientY }; dragMoved = false;
});
window.addEventListener('pointermove', function(e){
  if (dragId === null || e.pointerId !== dragId || dragOnCandle) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if (!dragMoved && Math.abs(dx) + Math.abs(dy) < 8) return;
  if (!dragMoved){ dragMoved = true; suppressCakeClick = true; setPlxTransition(false); cake3d.classList.add('dragging'); }
  const r = cakeEl.getBoundingClientRect();
  tilt.y = Math.max(-8, Math.min(8, dx / r.width * 16));
  tilt.x = Math.max(-8, Math.min(8, -dy / r.height * 16));
  applyTilt(tilt.x, tilt.y);
});
function tiltEnd(e){ if (dragId !== null && e.pointerId === dragId) endTilt(); }
window.addEventListener('pointerup', tiltEnd);
window.addEventListener('pointercancel', tiltEnd);
cake3d.addEventListener('click', function(e){
  if (suppressCakeClick){ suppressCakeClick = false; return; }
  if (e.target.closest('#sliceEl')) return;
  if (act !== 2 && act !== 3) return;
  /* tap near a candle (flame + upper stick) toggles that candle; anywhere else cuts */
  const r = cakeEl.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 100;
  const y = (e.clientY - r.top) / r.height * 100;
  let best = -1, bestD = 1e9;
  for (let i = 0; i < CANDLE_POS.length; i++){
    const dx = x - CANDLE_POS[i][0], dy = y - (CANDLE_POS[i][1] + 5.5);
    const d = (dx / 17) * (dx / 17) + (dy / 14) * (dy / 14);
    if (d < bestD){ bestD = d; best = i; }
  }
  if (best >= 0 && bestD < 1){ toggleCandle(best); return; }
  cutCake();
});
sliceEl.addEventListener('click', function(e){
  e.stopPropagation();
  if (act !== 2 && act !== 3) return;
  eatSlice(e);
});
function startAct3(){
  if (act !== 2) return;
  setAct(3);
  pageHead.classList.remove('dim');
  princessEl.classList.remove('show');
  letters.forEach(function(p){ if (p.state === 1) p.state = 2; });
  setTimeout(function(){
    letterEl.classList.add('show');
    turnEl.classList.add('show');
    chime();
  }, 900);
}
function resetDemo(){
  setAct(1); taps = 0;
  stopMusicLoop();
  tilt.x = 0; tilt.y = 0;
  if (cake3d) cake3d.style.transform = '';
  if (cakeShadow){ cakeShadow.style.transform = ''; cakeShadow.style.opacity = ''; }
  [gardenEl, moonEl, petalsEl].forEach(function(el){ if (el) el.style.transform = ''; });
  rockets = []; sparks = []; letters = []; flashes = [];
  if (shellTimer){ clearInterval(shellTimer); shellTimer = null; }
  melodyTimers.forEach(clearTimeout); melodyTimers = [];
  cascadeTimers.forEach(clearTimeout); cascadeTimers = [];
  if (musicGain && actx){ try{ musicGain.gain.setTargetAtTime(0, actx.currentTime, .05); }catch(e){} }
  finaleBtn.classList.remove('show');
  tapHint.style.opacity = '1';
  pageHead.classList.remove('dim');
  cakeWrap.classList.remove('show');
  cakeGap.classList.remove('show');
  sliceEl.classList.remove('cut', 'bite1', 'bite2', 'gone');
  cakeHint.classList.remove('show');
  cakeHint.textContent = 'Touch a candle to blow it out \u2014 touch again to light it';
  yumEl.classList.remove('show');
  candleEls.forEach(function(c){ c.classList.remove('lit'); const sm = c.querySelector('.smoke'); if (sm) sm.classList.remove('puff'); });
  for (let i = 0; i < candleState.length; i++) candleState[i] = false;
  knifeEl.classList.remove('cutting', 'done');
  flashes = [];
  if (yumTimer){ clearTimeout(yumTimer); yumTimer = null; }
  cakeCut = false; bites = 0;
  princessEl.classList.remove('show');
  letterEl.classList.remove('show');
  turnEl.classList.remove('show');
}

/* — input — */
stage.addEventListener('pointerdown', function(e){
  if (e.target.closest('button')) return;
  if (act !== 1) return;
  startMusicLoop(); /* the cute music-box starts on her very first tap */
  const r = stage.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  launchRocket(x, y, { gold: Math.random() < .65 });
  taps++;
  if (taps >= 3) finaleBtn.classList.add('show');
});
finaleBtn.addEventListener('click', startFinale);
document.getElementById('replayBtn').addEventListener('click', resetDemo);
musicBtn.addEventListener('click', function(){
  muted = !muted;
  musicBtn.classList.toggle('muted', muted);
  if (musicGain) musicGain.gain.value = muted ? 0 : 1;
  setSfxMuted(muted);
});
if (document.fonts && document.fonts.load){
  document.fonts.load('600 100px "Playfair Display"').catch(function(){});
  document.fonts.load('400 46px "Great Vibes"').catch(function(){});
}
resize();
startLoop();
window.__ch12 = {
  state: function(){ return { act: act, taps: taps, rockets: rockets.length, sparks: sparks.length, letters: letters.length, muted: muted,
    cakeShown: cakeWrap.classList.contains('show'), cakeCut: cakeCut, bites: bites,
    musicPlaying: melodyPlaying, melodyNotes: melodyNotes,
    musicActive: melodyPlaying || (actx ? actx.currentTime < melodyEndT : false),
    tilt: { x: tilt.x, y: tilt.y },
    tiltTransform: cake3d.style.transform || '',
    audioPlays: audioPlays, sfxCount: sfxAudios.length,
    candles: candleState.slice(), knifeCutting: knifeEl.classList.contains('cutting'),
    candlesLit: candleEls.filter(function(c){ return c.classList.contains('lit'); }).length,
    sliceGone: sliceEl.classList.contains('gone'), hintShown: cakeHint.classList.contains('show') }; },
  letterCount: function(){ return letters.length; }
};
})();
</script>
</body>
