*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#160818}
#stage{position:relative;width:100%;height:100%;overflow:hidden;
  background:
    radial-gradient(130% 70% at 50% 0%, rgba(122,32,64,.55) 0%, rgba(122,32,64,0) 60%),
    radial-gradient(120% 90% at 50% 108%, #1a0b26 0%, rgba(26,11,38,0) 55%),
    linear-gradient(180deg,#3d0f28 0%, #2a0a20 34%, #1c0718 62%, #120614 100%);}
#sky{position:absolute;inset:0;z-index:1}
/* soft out-of-focus golden bokeh — pre-drawn radial circles, opacity only, no blur */
.bokeh{position:absolute;border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(255,214,140,.85) 0%,rgba(255,190,100,.35) 42%,rgba(255,190,100,0) 72%);
  animation:bok 7s ease-in-out infinite alternate}
@keyframes bok{from{opacity:.14}to{opacity:.5}}
/* warm champagne-gold aura behind the cake */
#aura{position:absolute;left:50%;top:46%;width:130%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(255,196,110,.34) 0%,rgba(255,170,90,.14) 42%,rgba(255,170,90,0) 68%);
  animation:aura 5.5s ease-in-out infinite alternate}
@keyframes aura{from{opacity:.75}to{opacity:1}}
/* header */
#pageHead{position:absolute;left:0;right:0;top:0;z-index:6;text-align:center;padding-top:26px;pointer-events:none;transition:opacity .6s}
#pageHead.dim{opacity:0}
.kicker{font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#d9a05a}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:34px;line-height:1.08;color:#f8ecc9;margin-top:8px}
.whisper{font-family:'Great Vibes',cursive;font-size:27px;color:#f3c96b;margin-top:4px;transition:opacity .6s}
#pageHead.whisperOff .whisper{opacity:0}
/* Demo 3 tag */
#demoTag{position:absolute;left:12px;bottom:12px;z-index:9;font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.28em;
  text-transform:uppercase;color:#e8c98a;border:1px solid rgba(232,201,138,.45);border-radius:20px;padding:5px 10px;opacity:.8}
/* cake stage */
#cakeWrap{position:absolute;left:50%;top:138px;z-index:4;transform:translateX(-50%);
  transition:transform 1.15s cubic-bezier(.45,.05,.35,1),opacity 1.05s ease}
#cakeWrap.glide{transform:translateX(-50%) translateY(112vh);opacity:0}
#cakeStage{position:relative;width:min(74vw,290px,calc((100vh - 310px)*.72));aspect-ratio:520/694}
#cakeImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#cakeRefl{position:absolute;left:6%;right:6%;top:99%;height:16%;overflow:hidden;opacity:.10;pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 82%);mask-image:linear-gradient(180deg,#000 0%,transparent 82%)}
#cakeRefl img{width:100%;height:100%;object-fit:contain;object-position:top;transform:scaleY(-1)}
#cakeShadow{position:absolute;left:2%;right:2%;bottom:-5%;height:8%;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.80) 0%,rgba(0,0,0,.42) 55%,rgba(0,0,0,0) 78%)}
/* tight dark contact shadow directly under the base rim — seats the cake on the floor */
#cakeContact{position:absolute;left:20%;right:20%;bottom:-2%;height:3.4%;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.85) 0%,rgba(0,0,0,.45) 55%,rgba(0,0,0,0) 80%)}
/* faint dark scrim over the very bottom of the photo — tones the bright white plate edge down */
#plateScrim{position:absolute;left:0;right:0;bottom:0;height:11%;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(22,6,18,0) 0%,rgba(22,6,18,.30) 100%)}
/* warm candlelight cast over the top frosting — opacity pulsed by JS only */
#castGlow{position:absolute;left:6%;right:6%;top:-1%;height:36%;z-index:2;pointer-events:none;opacity:.55;
  background:radial-gradient(ellipse 62% 78% at 50% 16%,rgba(255,196,105,.75) 0%,rgba(255,166,70,.34) 46%,rgba(255,166,70,0) 76%)}
#fx{position:absolute;left:-14%;top:-9%;width:128%;height:112%;z-index:3;pointer-events:none}
#cakeHint{margin-top:14px;text-align:center;font-family:'Jost',sans-serif;font-size:12.5px;letter-spacing:.22em;
  text-transform:uppercase;color:#f0d3a0;opacity:.92;transition:opacity .5s;white-space:nowrap}
#cakeHint.gone{opacity:0}
/* Act 3 lines */
#letterLine{position:absolute;left:0;right:0;top:38%;z-index:6;padding:0 34px;text-align:center;
  font-family:'Great Vibes',cursive;font-size:31px;line-height:1.35;color:#ffe9bd;opacity:0;pointer-events:none;
  transition:opacity 1.1s ease;text-shadow:0 2px 18px rgba(0,0,0,.45)}
#letterLine.show{opacity:1}
#turnHint{position:absolute;left:0;right:0;top:57%;z-index:6;text-align:center;font-family:'Jost',sans-serif;
  font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:#f3c96b;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
#turnHint.show{opacity:1}
/* buttons */
#musicBtn{position:absolute;right:14px;top:14px;z-index:9;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(240,211,160,.5);background:rgba(20,8,20,.55);color:#f0d3a0;font-size:19px;cursor:pointer}
#musicBtn.muted{opacity:.45}
#replayBtn{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:9;display:none;
  font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.16em;color:#f6e7c8;cursor:pointer;
  background:rgba(20,8,20,.55);border:1px solid rgba(240,211,160,.55);border-radius:24px;padding:11px 22px}
#replayBtn.show{display:block}
@media (max-height:600px){
  #pageHead{padding-top:18px} h1{font-size:28px} .whisper{font-size:23px}
  #cakeWrap{top:118px}
  #letterLine{font-size:27px;top:36%} #turnHint{top:56%}
}
@media (prefers-reduced-motion:reduce){
  .bokeh,#aura{animation:none}
}
</style>
</head>

/* — pre-drawn spark sprites (no blur, no shadowBlur) — */
function sprite(colorA, colorB){

  const g = c.getContext('2d');

/* — stars: many small, gentle twinkle (opacity only) — */
let stars = [];
function buildStars(){
  stars = [];
  const n = RM ? 30 : 72;
  for (let i = 0; i < n; i++) stars.push({ x: Math.random()*W, y: Math.random()*H*0.66, r: .6 + Math.random()*1.4, ph: Math.random()*6.28, sp: .35 + Math.random()*1.1 });
}
function drawStars(t){
  for (const s of stars){
    const a = .22 + .6 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.sp + s.ph));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffe9b0';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* — fireworks state — */
let act = 1, taps = 0, muted = false, shapeIdx = 0;
let rockets = [], sparks = [], letters = [], flashes = [];
let rafOn = false, lastT = 0;
const SHAPES = ['peony','willow','ring','crackle'];
const MAX_SPARKS = 750;

function launchRocket(x, y, opts){
  opts = opts || {};
  playWhoosh();
  rockets.push({ x: x, y: y + 30, ty: y - (90 + Math.random()*70), vx: (Math.random()-.5)*.6,
    vy: -(7 + Math.random()*2.5), trail: [], gold: opts.gold !== false,
    shape: opts.shape || SHAPES[shapeIdx++ % SHAPES.length], burstN: opts.burstN || 0 });
}

/* Layered burst: gold core + rose secondary + crackling star sparks + gold rain trails. */
function burst(x, y, shape, gold){
  const coreN = RM ? 34 : 88, secN = RM ? 18 : 48, crkN = RM ? 12 : 36;
  const coreSpr = gold ? sprGold : sprRose, secSpr = gold ? sprRose : sprGold;
  function push(s){ sparks.push(s); if (sparks.length > MAX_SPARKS) sparks.splice(0, sparks.length - MAX_SPARKS); }
  /* gold core */
  for (let i = 0; i < coreN; i++){
    let a, sp;
    if (shape === 'ring'){ a = (i / coreN) * 6.283; sp = 3.4 + Math.random()*.4; }
    else if (shape === 'willow'){ a = Math.random()*6.283; sp = 1.4 + Math.random()*2.6; }
    else { a = Math.random()*6.283; sp = 1.4 + Math.random()*4.0; }
    push({ x:x, y:y, px:x, py:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - .6, life:1,
      decay: shape === 'willow' ? .004 + Math.random()*.005 : .008 + Math.random()*.014,
      s: 6.5 + Math.random()*7, spr: coreSpr, grav: shape === 'willow' ? .075 : .035,
      drag: .985, trail: shape === 'willow', jit: shape === 'crackle' });
  }
  /* rose secondary, slightly slower, offset angles */
  for (let i = 0; i < secN; i++){
    const a = Math.random()*6.283, sp = .8 + Math.random()*2.2;
    push({ x:x, y:y, px:x, py:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - .4, life:1,
      decay:.01 + Math.random()*.012, s: 5 + Math.random()*6, spr: secSpr, grav:.03, drag:.982, trail:false, jit:false });
  }
  /* crackling star sparks: tiny, bright, jittering */
  for (let i = 0; i < crkN; i++){
    const a = Math.random()*6.283, sp = 2 + Math.random()*3.4;
    push({ x:x, y:y, px:x, py:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1,
      decay:.02 + Math.random()*.02, s: 3.5 + Math.random()*3.5, spr: sprWhite, grav:.02, drag:.97, trail:false, jit:true });
  }
  /* gold rain trails (willow droop): slow falling gold drops */
  if (shape === 'willow'){
    for (let i = 0; i < 22; i++){
      push({ x: x + (Math.random()-.5)*70, y: y + (Math.random()-.5)*30, px:0, py:0,
        vx:(Math.random()-.5)*.4, vy: .9 + Math.random()*1.1, life:1, decay:.006 + Math.random()*.005,
        s: 4 + Math.random()*4, spr: sprGold, grav:.05, drag:.995, trail:true, jit:false });
    }
  }
}

function tick(t){
  if (!rafOn) return;
  const dt = Math.min(50, t - lastT || 16); lastT = t;
  ctx.clearRect(0, 0, W, H);
  drawStars(t);
  /* rockets */
  for (let i = rockets.length - 1; i >= 0; i--){
    const r = rockets[i];
    r.trail.push({ x: r.x, y: r.y }); if (r.trail.length > 9) r.trail.shift();
    r.x += r.vx; r.y += r.vy; r.vy += .06;
    ctx.globalAlpha = .85;
    for (let j = 0; j < r.trail.length; j++){
      const p = r.trail[j], k = j / r.trail.length;
      ctx.drawImage(r.gold ? sprGold : sprRose, p.x - 4*k - 2, p.y - 4*k - 2, 8*k + 2, 8*k + 2);
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(r.gold ? sprGold : sprRose, r.x - 6, r.y - 6, 12, 12);
    if (r.y <= r.ty || r.vy >= 0){
      rockets.splice(i, 1);
      burst(r.x, r.y, r.shape, r.gold);
      flashes.push({ x: r.x, y: r.y, life: 1 });
      playBoom();
      if (r.shape === 'crackle' || r.shape === 'willow') setTimeout(playCrackle, 200);
    }
  }
  /* core flash: bright white bloom at each burst, fading fast */
  for (let i = flashes.length - 1; i >= 0; i--){
    const f = flashes[i];
    f.life -= dt * .005;
    if (f.life <= 0){ flashes.splice(i, 1); continue; }
    ctx.globalAlpha = f.life * .9;
    const fs = 26 + (1 - f.life) * 44;
    ctx.drawImage(sprWhite, f.x - fs, f.y - fs, fs*2, fs*2);
  }
  ctx.globalAlpha = 1;
  /* sparks */
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.px = s.x; s.py = s.y;
    if (s.jit){ s.vx += (Math.random()-.5)*.5; s.vy += (Math.random()-.5)*.5; }
    s.x += s.vx; s.y += s.vy; s.vy += s.grav; s.vx *= s.drag; s.vy *= s.drag; s.life -= s.decay;
    if (s.life <= 0){ sparks.splice(i, 1); continue; }
    const a = Math.max(0, s.life);
    if (s.trail){
      ctx.globalAlpha = a * .55; ctx.strokeStyle = '#ffd97a'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(s.px, s.py); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
    ctx.globalAlpha = a;
    ctx.drawImage(s.spr, s.x - s.s, s.y - s.s, s.s*2, s.s*2);
  }
  ctx.globalAlpha = 1;
  /* sky letters — glow pass (big faint sprite, opacity pulse) + bright core */
  for (let i = letters.length - 1; i >= 0; i--){
    const p = letters[i];
    if (p.state === 0){
      p.vx += (p.tx - p.x) * .024; p.vy += (p.ty - p.y) * .024;
      p.vx *= .86; p.vy *= .86; p.x += p.vx; p.y += p.vy;
      if (Math.abs(p.tx - p.x) < 3 && Math.abs(p.ty - p.y) < 3){ p.state = 1; p.x = p.tx; p.y = p.ty; }
    } else if (p.state === 1){
      p.a = .85 + .15 * Math.sin(t * .003 + p.ph);
    } else {
      p.vy += .03; p.y += p.vy; p.a -= .012;
      if (p.a <= 0){ letters.splice(i, 1); continue; }
    }
    const pulse = .10 + .06 * (0.5 + 0.5 * Math.sin(t * .0022 + p.ph));
    const lSpr = p.spr || sprRed;
    if (p.state === 1){ ctx.globalAlpha = pulse; ctx.drawImage(lSpr, p.x - p.s*1.3, p.y - p.s*1.3, p.s*2.6, p.s*2.6); }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.a));
    ctx.drawImage(lSpr, p.x - p.s, p.y - p.s, p.s*2, p.s*2);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(tick);
}
function startLoop(){ if (!rafOn){ rafOn = true; lastT = 0; requestAnimationFrame(tick); } }

function boxNote(f, t, dur){
  const o1 = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain(), g2 = actx.createGain();
  o1.type = 'sine'; o1.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f*2; g2.gain.value = .32;

/* — V6: cute music-box melody runs from the FIRST sky tap, through the
   fireworks and the finale, into the quiet landing. It loops gently; the
   finale restarts it cleanly so shells and candles stay in rhythm. — */
let melodyPlaying = false, melodyLoopTimers = [], melodyNotes = 0, melodyEndT = 0;
function scheduleMelody(t0){
  const beat = .40; let t = t0; const onsets = [];
  HB.forEach(function(s){
    onsets.push(t);
    if (s[0] && !muted){ boxNote(NOTE[s[0]], t, s[1]*beat); melodyNotes++; }
    t += s[1]*beat;
  });
  melodyEndT = t0 + (t - t0);

function startMusicLoop(){
  if (melodyPlaying) return;
  try{ ac(); }catch(e){ return; }
  melodyPlaying = true;
  const playOnce = function(){
    if (!melodyPlaying) return;
    const res = scheduleMelody(actx.currentTime + .1);
    melodyLoopTimers.push(setTimeout(playOnce, (res.total + .8) * 1000));
  };
  playOnce();
}
function stopMusicLoop(){
  melodyPlaying = false;
  melodyLoopTimers.forEach(clearTimeout); melodyLoopTimers = [];
}

    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;

let audioPlays = { whoosh: 0, boom: 0, crackle: 0 };
const sfxAudios = [];
/* softMs: fade the volume in over this many ms so the hit is a gentle distant
   sparkle, not a sharp percussive crack — the music box stays in front. */
function makePool(uri, n, softMs){
  const pool = [];
  for (let i = 0; i < n; i++){ const a = new Audio(uri); a.preload = 'auto'; pool.push(a); sfxAudios.push(a); }
  let idx = 0;
  return function(vol){
    if (muted) return;
    const a = pool[idx++ % pool.length];
    try{
      a.currentTime = 0;
      if (softMs){
        a.volume = 0;
        const pr = a.play(); if (pr && pr.catch) pr.catch(function(){});
        const steps = 6, stepMs = Math.max(20, Math.round(softMs / steps));
        let k = 0;
        const iv = setInterval(function(){
          k++; a.volume = vol * Math.min(1, k / steps);
          if (k >= steps) clearInterval(iv);
        }, stepMs);
      } else {
        a.volume = vol;
        const pr = a.play(); if (pr && pr.catch) pr.catch(function(){});
      }
    }catch(e){}
  };
}
const playWhooshSnd = makePool(WHOOSH_URI, 4, 60);
const playBoomSnd = makePool(BOOM_URI, 4, 180);
const playCrackleSnd = makePool(CRACKLE_URI, 2, 80);
function playWhoosh(){ audioPlays.whoosh++; playWhooshSnd(.45); }
const BOOM_VOL = .35; /* demo3: ~59% quieter than demo2's .85 — music box leads */
function playBoom(){ audioPlays.boom++; playBoomSnd(BOOM_VOL); }
function playCrackle(){ audioPlays.crackle++; playCrackleSnd(.55); }
function setSfxMuted(m){ sfxAudios.forEach(function(a){ a.muted = m; if (m){ try{ a.pause(); }catch(e){} } }); }
function sliceSound(){
  if (muted) return;
  try{
    ac();
    const t = actx.currentTime;
    const src = actx.createBufferSource(); src.buffer = getNoise();
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(1400, t); bp.frequency.exponentialRampToValueAtTime(320, t + .22);
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + .28);
    src.connect(bp); bp.connect(g); g.connect(musicGain); src.start(t); src.stop(t + .3);
  }catch(e){}
}
function chime(){
  if (muted) return;
  try{ ac(); const t = actx.currentTime + .05; boxNote(NOTE.E5, t, .8); boxNote(NOTE.C6, t + .22, 1.1); }catch(e){}
}

const fxCv = document.getElementById('fx');
const fx = fxCv.getContext('2d');
const replayBtn = document.getElementById('replayBtn');

/* measured wick tips on the 520x694 cutout (fractions of the image) */
const CANDLES = [
  { fx: 0.399, fy: 0.061, ph: 0.0, lit: true, lean: 0, blowT: 0 },
  { fx: 0.488, fy: 0.011, ph: 2.1, lit: true, lean: 0, blowT: 0 },
  { fx: 0.514, fy: 0.031, ph: 4.2, lit: true, lean: 0, blowT: 0 }
];
let smoke = [];
let fxDPR = 1, fxW = 0, fxH = 0, fxScale = 1;

function fxResize(){
  fxDPR = Math.min(window.devicePixelRatio || 1, 2);
  fxW = fxCv.clientWidth || 300; fxH = fxCv.clientHeight || 400;
  fxCv.width = Math.round(fxW * fxDPR); fxCv.height = Math.round(fxH * fxDPR);
  fx.setTransform(fxDPR, 0, 0, fxDPR, 0, 0);
  const ir = cakeImg.getBoundingClientRect();
  fxScale = ir.width / 520;
}
window.addEventListener('resize', fxResize);

/* candle anchor in fx-canvas CSS pixels */
function candleXY(c){
  const ir = cakeImg.getBoundingClientRect(), fr = fxCv.getBoundingClientRect();
  return { x: ir.left - fr.left + c.fx * ir.width, y: ir.top - fr.top + c.fy * ir.height };
}

function puffSound(){
  if (muted) return;
  try{
    ac(); const t = actx.currentTime + .02;
    const src = actx.createBufferSource(); src.buffer = getNoise();
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 750; bp.Q.value = .8;
    const g = actx.createGain();
    g.gain.setValueAtTime(.26, t); g.gain.exponentialRampToValueAtTime(.0001, t + .32);
    src.connect(bp); bp.connect(g); g.connect(musicGain);
    src.start(t); src.stop(t + .35);
  }catch(e){}
}

function spawnSmoke(c){
  const p = candleXY(c), n = RM ? 6 : 13;
  for (let i = 0; i < n; i++){
    smoke.push({ x: p.x + (Math.random()-.5)*4, y: p.y - 4 - i*2.5,
      vx: (Math.random()-.5)*.18, vy: .28 + Math.random()*.22,
      r: 1.6 + Math.random()*1.6, life: 0, max: 1500 + Math.random()*700, ph: Math.random()*6.28 });
  }
}

function litCount(){ let n = 0; CANDLES.forEach(function(c){ if (c.lit) n++; }); return n; }

function blowCandle(i, leanDir){
  const c = CANDLES[i];
  if (!c || !c.lit || act !== 1) return;
  c.lit = false; c.lean = (leanDir || .4) * 1.15; c.blowT = performance.now();
  spawnSmoke(c);
  puffSound();
  if (litCount() === 0) setTimeout(startFinale, 650);
}
function relightCandle(i){
  const c = CANDLES[i];
  if (!c || c.lit || act !== 1) return;
  c.lit = true; c.lean = 0;
  try{ chime(); }catch(e){}
}

/* — flame drawing: blue base + white-gold core + warm halo, canvas 'lighter' — */
function drawFlame(x, y, t, c, scale){
  const sway = RM ? 0 : Math.sin(t * .0021 + c.ph) * .14 + Math.sin(t * .0053 + c.ph * 2.7) * .05;
  const flick = RM ? 1 : .92 + .06 * Math.sin(t * .013 + c.ph * 3.1) + .04 * Math.sin(t * .029 + c.ph);
  const h = 26 * fxScale * flick * scale, w = 11 * fxScale * scale;
  const leanX = (sway + c.lean) * h * .55;
  const tipX = x + leanX, tipY = y - h;
  /* warm outer halo */
  let g = fx.createRadialGradient(x, y - h * .42, 0, x, y - h * .42, h * 1.05);
  g.addColorStop(0, 'rgba(255,176,84,.34)'); g.addColorStop(.6, 'rgba(255,140,60,.12)'); g.addColorStop(1, 'rgba(255,140,60,0)');
  fx.fillStyle = g;
  fx.beginPath(); fx.ellipse(x, y - h * .42, h * .95, h * .8, 0, 0, 6.29); fx.fill();
  /* outer flame — warm orange teardrop */
  g = fx.createLinearGradient(x, y, tipX, tipY);
  g.addColorStop(0, 'rgba(255,122,26,.95)'); g.addColorStop(.55, 'rgba(255,176,60,.85)'); g.addColorStop(1, 'rgba(255,214,120,.85)');
  fx.fillStyle = g;
  fx.beginPath();
  fx.moveTo(x - w * .5, y);
  fx.bezierCurveTo(x - w * .62, y - h * .42, x - w * .18 + leanX * .4, y - h * .82, tipX, tipY);
  fx.bezierCurveTo(x + w * .18 + leanX * .4, y - h * .82, x + w * .62, y - h * .42, x + w * .5, y);
  fx.bezierCurveTo(x + w * .28, y + h * .06, x - w * .28, y + h * .06, x - w * .5, y);
  fx.fill();
  /* bright white-gold core */
  const ch = h * .58, cw = w * .52;
  g = fx.createLinearGradient(x, y, tipX, tipY);
  g.addColorStop(0, 'rgba(255,246,214,.98)'); g.addColorStop(.6, 'rgba(255,214,130,.92)'); g.addColorStop(1, 'rgba(255,190,90,.75)');
  fx.fillStyle = g;
  fx.beginPath();
  fx.moveTo(x - cw * .5, y - h * .04);
  fx.bezierCurveTo(x - cw * .6, y - h * .3, x - cw * .16 + leanX * .3, y - h * .5, x + leanX * .55, y - h * .04 - ch);
  fx.bezierCurveTo(x + cw * .16 + leanX * .3, y - h * .5, x + cw * .6, y - h * .3, x + cw * .5, y - h * .04);
  fx.bezierCurveTo(x + cw * .26, y, x - cw * .26, y, x - cw * .5, y - h * .04);
  fx.fill();
  /* subtle blue base */
  fx.fillStyle = 'rgba(120,170,255,.5)';
  fx.beginPath(); fx.ellipse(x, y - h * .02, w * .2, h * .09, 0, 0, 6.29); fx.fill();
}

let fxLast = 0;
function fxTick(t){
  requestAnimationFrame(fxTick);
  const dt = Math.min(50, t - (fxLast || t)); fxLast = t;
  fx.clearRect(0, 0, fxW, fxH);
  if (act !== 1){ return; }
  /* smoke first (normal compositing), flames after with 'lighter' */
  for (let i = smoke.length - 1; i >= 0; i--){
    const s = smoke[i];
    s.life += dt;
    if (s.life >= s.max){ smoke.splice(i, 1); continue; }
    const k = s.life / s.max;
    s.y -= s.vy * dt * .06; s.x += (Math.sin(t * .0016 + s.ph) * .22 + s.vx) * dt * .06;
    const r = s.r * (1 + k * 3.2);
    fx.globalAlpha = (1 - k) * .42;
    fx.fillStyle = '#e8e4ea';
    fx.beginPath(); fx.arc(s.x, s.y, r, 0, 6.29); fx.fill();
  }
  fx.globalAlpha = 1;
  fx.globalCompositeOperation = 'lighter';
  const now = performance.now();
  CANDLES.forEach(function(c){
    let scale = 1, lean = c.lean;
    if (!c.lit){
      const k = (now - c.blowT) / 160;
      if (k >= 1){ return; }
      scale = 1 - k; lean = c.lean * (1 - k);
    } else {
      c.lean *= .94; lean = c.lean;
    }
    const p = candleXY(c);
    const cc = { ph: c.ph, lean: lean };
    drawFlame(p.x, p.y, t, cc, scale);
  });
  fx.globalCompositeOperation = 'source-over';
  fx.globalAlpha = 1;
  /* candlelight cast on the frosting: bright while lit, dims per candle */
  const lit = litCount();
  const flick = RM ? 0 : .05 * Math.sin(t * .011) + .035 * Math.sin(t * .023 + 1.7);
  castGlow.style.opacity = String(lit === 0 ? .06 : Math.max(.05, .2 + .48 * (lit / 3) + flick));
}

/* — input: tap a flame to blow it out / tap an unlit candle to relight; swipe across blows out — */
let pDown = null, pLast = null, pMoved = false;
function segDist(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1, l2 = dx*dx + dy*dy;
  let tt = l2 ? ((px - x1)*dx + (py - y1)*dy) / l2 : 0;
  tt = Math.max(0, Math.min(1, tt));
  const cx = x1 + tt*dx, cy = y1 + tt*dy;
  return Math.hypot(px - cx, py - cy);
}
function stagePoint(e){
  const r = stage.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function candleStageXY(c){
  const p = candleXY(c), fr = fxCv.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  return { x: fr.left - sr.left + p.x, y: fr.top - sr.top + p.y };
}
stage.addEventListener('pointerdown', function(e){
  if (e.target.closest('button')) return;
  if (act !== 1) return;
  try{ ac(); }catch(err){}
  pDown = stagePoint(e); pLast = pDown; pMoved = false;
});
stage.addEventListener('pointermove', function(e){
  if (!pDown || act !== 1) return;
  const p = stagePoint(e);
  if (Math.hypot(p.x - pDown.x, p.y - pDown.y) > 10) pMoved = true;
  const dx = p.x - pLast.x;
  CANDLES.forEach(function(c, i){
    if (!c.lit) return;
    const cp = candleStageXY(c);
    if (segDist(cp.x, cp.y, pLast.x, pLast.y, p.x, p.y) < 30) blowCandle(i, dx >= 0 ? 1 : -1);
  });
  pLast = p;
});
stage.addEventListener('pointerup', function(e){
  if (!pDown) return;
  const p = stagePoint(e);
  if (!pMoved && act === 1){
    let best = -1, bestD = 1e9;
    CANDLES.forEach(function(c, i){
      const cp = candleStageXY(c);
      const d = Math.hypot(p.x - cp.x, p.y - (cp.y - 12 * fxScale));
      if (d < bestD){ bestD = d; best = i; }
    });
    if (best >= 0 && bestD < 36){
      if (CANDLES[best].lit) blowCandle(best, .4); else relightCandle(best);
    }
  }
  pDown = null; pLast = null;
});
stage.addEventListener('pointercancel', function(){ pDown = null; pLast = null; });

/* — sky letters: sample any lines into spark points (gold) — */
function sampleText(lines, font, fs, cy, maxPts){
  const off = document.createElement('canvas');
  off.width = W; off.height = Math.round(H * .66);
  const g = off.getContext('2d');
  let f = fs;
  g.font = font.replace('FS', String(f));
  try{ if (font.indexOf('Great Vibes') === -1) g.letterSpacing = '5px'; }catch(e){}
  let widest = 0;
  lines.forEach(function(l){ widest = Math.max(widest, g.measureText(l).width); });
  if (widest > W - 36){ f = Math.floor(f * (W - 36) / widest); g.font = font.replace('FS', String(f)); }
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (lines.length === 2){ g.fillText(lines[0], W/2, cy); g.fillText(lines[1], W/2, cy + f * 1.08); }
  else g.fillText(lines[0], W/2, cy);
  const data = g.getImageData(0, 0, off.width, off.height).data;
  let pts = [];
  for (const step of [6, 5, 4, 3]){
    pts = [];
    for (let y = 0; y < off.height; y += step){
      for (let x = 0; x < off.width; x += step){
        if (data[(y * off.width + x) * 4 + 3] > 120) pts.push({ x: x, y: y });
      }
    }
    if (pts.length >= 150 || step === 3) break;
  }
  if (pts.length <= maxPts) return pts;
  const out = [], stride = pts.length / maxPts;
  for (let i = 0; i < maxPts; i++) out.push(pts[Math.floor(i * stride)]);
  return out;
}

/* — acts — */
let letterPts = [], letterIdx = 0, shellTimer = null, melodyTimers = [], cascadeTimers = [];
let burstsPaused = false, lettersFormedAt = 0;
function launchShell(){ if (burstsPaused || act !== 2) return; launchRocket(40 + Math.random()*(W-80), H * (.30 + Math.random()*.25), { gold: Math.random() < .7 }); }
function setAct(n){ act = n; stage.setAttribute('data-act', String(n)); }

function startFinale(){
  if (act !== 1) return;
  setAct(2);
  cakeHint2.classList.add('gone');
  pageHead.classList.add('dim');
  pageHead.classList.add('whisperOff'); /* demo3 bug fix: Act 1 subtitle never returns */
  cakeWrap2.classList.add('glide');
  try{ ac(); if (musicGain) musicGain.gain.value = muted ? 0 : 1; }catch(e){}
  stopMusicLoop();
  const t0 = actx ? actx.currentTime + .1 : 0;
  const res = scheduleMelody(t0);
  const onsets = res.onsets, total = res.total;
  melodyTimers.push(setTimeout(function(){ startMusicLoop(); }, total * 1000 + 200));
  shellTimer = setInterval(launchShell, 420);
  /* letters: HAPPY BIRTHDAY (two lines under 430px) + Princess in script, all champagne-gold */
  const twoLine = W < 430;
  const hb = twoLine
    ? sampleText(['HAPPY', 'BIRTHDAY'], '600 FSpx "Playfair Display", serif', 62, H * .19, 200)
    : sampleText(['HAPPY BIRTHDAY'], '600 FSpx "Playfair Display", serif', 44, H * .24, 200);
  /* Princess sits below the HAPPY BIRTHDAY block with a real gap, at every size */
  let hbMaxY = 0;
  hb.forEach(function(p){ if (p.y > hbMaxY) hbMaxY = p.y; });
  const pr = sampleText([PRINCESS_NAME], '400 FSpx "Great Vibes", cursive', 58, hbMaxY + 82, 150);
  letterPts = hb.concat(pr); letterIdx = 0;
  const finalStart = onsets[onsets.length - 6];
  /* demo3: the moment the first letter batch flies in, stop ALL random background
     bursts — her name must read cleanly. The Grand Cascade waits until the letters
     have had a full ~2.5s clean hold, then plays as the climax before Act 3. */
  const CASCADE_START = finalStart + 5.6; /* letters settle by ~finalStart+3.1, hold 2.5s */
  melodyTimers.push(setTimeout(function(){ burstsPaused = true; }, Math.max(0, (finalStart - (actx ? actx.currentTime : 0)) * 1000)));
  const batch = Math.ceil(letterPts.length / 6);
  for (let k = 0; k < 6; k++){
    melodyTimers.push(setTimeout(function(){
      const end = Math.min(letterPts.length, letterIdx + batch);
      for (; letterIdx < end; letterIdx++){
        const p = letterPts[letterIdx];
        letters.push({ x: 30 + Math.random()*(W-60), y: H * (.12 + Math.random()*.3), vx: 0, vy: 0,
          tx: p.x, ty: p.y, s: 3.9 + Math.random()*2.1, a: .95, ph: Math.random()*6.28, state: 0,
          spr: (Math.random() < .55 ? sprLetter : sprWhite) });
      }
    }, Math.max(0, (finalStart + k * .42 - (actx ? actx.currentTime : 0)) * 1000)));
  }
  /* GRAND CASCADE — after the clean letter hold, not over her name */
  melodyTimers.push(setTimeout(function(){
    if (shellTimer){ clearInterval(shellTimer); shellTimer = null; }
    for (let k = 0; k < 9; k++){
      cascadeTimers.push(setTimeout(function(){
        launchRocket(36 + (k % 3) * (W-72)/2 + (Math.random()-.5)*30, H * (.28 + Math.random()*.22), { gold: k % 2 === 0 });
      }, k * 150));
    }
    cascadeTimers.push(setTimeout(function(){
      launchRocket(W * .5, H * .30, { gold: true });
      launchRocket(W * .22, H * .34, { gold: false });
      launchRocket(W * .78, H * .34, { gold: false });
      launchRocket(W * .08, H * .38, { gold: true });
      launchRocket(W * .92, H * .38, { gold: true });
      setTimeout(playCrackle, 250); setTimeout(playCrackle, 650);
    }, 9 * 150 + 120));
  }, Math.max(0, (CASCADE_START - (actx ? actx.currentTime : 0)) * 1000)));
  melodyTimers.push(setTimeout(startAct3, Math.max(0, (CASCADE_START + 3.6 - (actx ? actx.currentTime : 0)) * 1000)));
}

let replayPoll = null;
function startAct3(){
  if (act !== 2) return;
  setAct(3);
  pageHead.classList.remove('dim');
  letters.forEach(function(p){ if (p.state !== 2) p.state = 2; }); /* every letter dissolves */
  setTimeout(function(){
    letterEl.classList.add('show');
    turnEl.classList.add('show');
    chime();
    /* demo3: Replay waits until the handoff has fully landed AND the sky is clear */
    let waited = 0;
    replayPoll = setInterval(function(){
      waited += 250;
      const lo = parseFloat(getComputedStyle(letterEl).opacity || '0');
      const clear = sparks.length === 0 && rockets.length === 0 && letters.length === 0;
      if ((lo >= .99 && clear) || waited >= 8000){
        clearInterval(replayPoll); replayPoll = null;
        replayBtn.classList.add('show');
      }
    }, 250);
  }, 900);
}

function resetDemo(){
  setAct(1);
  stopMusicLoop();
  rockets = []; sparks = []; letters = []; flashes = [];
  if (shellTimer){ clearInterval(shellTimer); shellTimer = null; }
  melodyTimers.forEach(clearTimeout); melodyTimers = [];
  cascadeTimers.forEach(clearTimeout); cascadeTimers = [];
  if (replayPoll){ clearInterval(replayPoll); replayPoll = null; }
  burstsPaused = false;
  if (musicGain && actx){ try{ musicGain.gain.setTargetAtTime(0, actx.currentTime, .05); }catch(e){} }
  pageHead.classList.remove('dim');
  pageHead.classList.remove('whisperOff');
  cakeWrap2.classList.remove('glide');
  cakeHint2.classList.remove('gone');
  letterEl.classList.remove('show');
  turnEl.classList.remove('show');
  replayBtn.classList.remove('show');
  CANDLES.forEach(function(c){ c.lit = true; c.lean = 0; c.blowT = 0; });
  smoke = [];
}

replayBtn.addEventListener('click', resetDemo);
musicBtn.addEventListener('click', function(){
  muted = !muted;
  musicBtn.classList.toggle('muted', muted);
  if (musicGain) musicGain.gain.value = muted ? 0 : 1;
  setSfxMuted(muted);
});
if (document.fonts && document.fonts.load){
  document.fonts.load('600 62px "Playfair Display"').catch(function(){});
  document.fonts.load('400 58px "Great Vibes"').catch(function(){});
}
resize();
fxResize();
startLoop();
requestAnimationFrame(fxTick);
window.__ch12 = {
  state: function(){ return { act: act, candlesLit: CANDLES.map(function(c){ return c.lit; }),
    letters: letters.length, rockets: rockets.length, sparks: sparks.length, muted: muted,
    musicPlaying: melodyPlaying, melodyNotes: melodyNotes,
    audioPlays: audioPlays, sfxCount: sfxAudios.length,
    glowOpacity: castGlow.style.opacity, smoke: smoke.length,
    cakeGliding: cakeWrap2.classList.contains('glide'),
    replayShown: replayBtn.classList.contains('show'),
    boomVol: BOOM_VOL, burstsPaused: burstsPaused,
    whisperOpacity: parseFloat(getComputedStyle(document.querySelector('#pageHead .whisper')).opacity || '0'),
    letterOpacity: parseFloat(getComputedStyle(letterEl).opacity || '0'),
    letterSparkS: letters.length ? letters[0].s : null,
    letterTotal: letterPts.length,
    letterStates: letters.reduce(function(m,p){ m[p.state]=(m[p.state]||0)+1; return m; }, {}) }; },
  blow: function(i){ blowCandle(i, .5); },
  relight: function(i){ relightCandle(i); },
  candlePos: function(i){ const p = candleStageXY(CANDLES[i]); return { x: p.x, y: p.y }; },
  finale: function(){ startFinale(); }
};
})();
