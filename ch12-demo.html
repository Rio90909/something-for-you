*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#150829}
body{font-family:'Jost',system-ui,sans-serif;color:#f6e7c8}
#stage{position:relative;width:100%;height:100dvh;overflow:hidden;
  background:linear-gradient(180deg,#150829 0%,#22103e 34%,#3a1849 58%,#571f45 76%,#2a0f33 100%)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* slim crescent moon, pure CSS: gold disc + a sky-coloured disc cutting into it */
.moon{position:absolute;top:12px;left:16px;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fff6d8 0%,#f7d774 45%,#e0a83c 100%);opacity:.95;pointer-events:none}
.moon::after{content:"";position:absolute;top:-3px;left:11px;width:33px;height:33px;border-radius:50%;
  background:#1d0e36}
/* rose-garden silhouette along the bottom: layered dark SVG hills + bushes */
.garden{position:absolute;left:0;right:0;bottom:0;width:100%;height:132px;pointer-events:none}
header{position:absolute;top:0;left:0;right:0;text-align:center;padding:26px 20px 0;pointer-events:none;z-index:3;transition:opacity .8s}
header.dim{opacity:0}
.kicker{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#d9b45c;opacity:.9}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:34px;line-height:1.08;color:#f8ecc9;margin-top:8px}
.whisper{font-family:'Great Vibes',cursive;font-size:27px;color:#f3c96b;margin-top:6px}
#tapHint{position:absolute;left:0;right:0;top:47%;text-align:center;font-size:13px;letter-spacing:.18em;
  text-transform:uppercase;color:#e8d5a8;opacity:.85;transition:opacity .6s;pointer-events:none;z-index:3}
#tapHint b{color:#ffd97a;font-weight:500}
#princessName{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:'Great Vibes',cursive;
  font-size:52px;color:#ff9ebb;text-shadow:0 0 14px rgba(255,158,187,.42),0 0 3px rgba(255,158,187,.30);
  opacity:0;transform:translateY(8px);transition:opacity 1.1s,transform 1.1s;
  pointer-events:none;z-index:3}
#princessName.show{opacity:1;transform:translateY(0)}
#letterLine{position:absolute;left:0;right:0;top:44%;padding:0 34px;text-align:center;font-family:'Great Vibes',cursive;
  font-size:30px;line-height:1.35;color:#f7dd9a;opacity:0;transform:translateY(10px);
  transition:opacity 1.4s,transform 1.4s;pointer-events:none;z-index:3}
#letterLine.show{opacity:1;transform:translateY(0)}
#turnHint{position:absolute;left:0;right:0;top:63%;text-align:center;font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:#e8d5a8;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:3}
#turnHint.show{opacity:.9}
#finaleBtn{position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:4;
  font-family:'Jost',sans-serif;font-size:14px;letter-spacing:.24em;text-transform:uppercase;
  color:#2a1200;background:linear-gradient(180deg,#ffe9a8,#e9b64a);border:1px solid #ffedb8;border-radius:999px;
  padding:14px 26px;cursor:pointer;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .9s,transform .9s}
#finaleBtn.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#musicBtn{position:absolute;top:16px;right:16px;z-index:5;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(247,215,116,.55);background:rgba(21,8,41,.45);color:#f7d774;font-size:17px;line-height:1;
  cursor:pointer}
#musicBtn.muted{opacity:.55}
#musicBtn.muted::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:1.5px;background:#f7d774;
  transform:rotate(-45deg)}
#replayBtn{position:absolute;left:16px;bottom:16px;z-index:5;background:none;border:0;color:#d9c48f;
  font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.14em;cursor:pointer;opacity:.85;padding:8px}
@media (max-width:359px){h1{font-size:30px}.whisper{font-size:24px}#princessName{font-size:44px}#letterLine{font-size:26px}}

/* — V4 pure-CSS pink patisserie cake: layered gradients only, no images — */
#cakeWrap{position:absolute;left:50%;bottom:24px;width:200px;z-index:2;
  transform:translate(-50%,112%);opacity:0;transition:transform 1.2s ease,opacity 1.2s ease;pointer-events:none}
#cakeWrap.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#cake{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
.candles{position:relative;display:flex;justify-content:space-between;width:52%;height:42px;align-items:flex-end;z-index:2;margin-bottom:-2px}
.candle{position:relative;width:6px;height:26px;border-radius:2px 2px 0 0;
  background:repeating-linear-gradient(45deg,#c9971c 0 3px,#fff3c4 3px 6px)}
.candle .flame{position:absolute;left:50%;bottom:calc(100% + 1px);width:10px;height:14px;margin-left:-5px;
  border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 78%,#fffbe8 0%,#ffe98a 28%,#ffb52e 58%,#ff7a1a 82%,#ff5a00 100%);
  opacity:0;transform-origin:50% 100%;transform:scale(.6);transition:opacity .3s}
.candle .glow{position:absolute;left:50%;top:-17px;width:26px;height:26px;margin-left:-13px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,80,.55) 0%,rgba(255,160,60,.22) 45%,rgba(255,160,60,0) 70%);
  opacity:0;transition:opacity .4s}
.candle.lit .flame{opacity:1;animation:flick .85s ease-in-out infinite alternate}
.candle.lit .glow{opacity:.8;animation:glowPulse 1.6s ease-in-out infinite alternate}
.candle:nth-child(2) .flame{animation-delay:.14s}.candle:nth-child(3) .flame{animation-delay:.28s}
.candle:nth-child(4) .flame{animation-delay:.07s}.candle:nth-child(5) .flame{animation-delay:.21s}
.candle:nth-child(2) .glow{animation-delay:.3s}.candle:nth-child(4) .glow{animation-delay:.6s}
@keyframes flick{from{transform:scale(1) rotate(-2deg);opacity:.92}to{transform:scale(1.12,1.2) rotate(2deg);opacity:1}}
@keyframes glowPulse{from{opacity:.45}to{opacity:.85}}
.tier{position:relative;border-radius:7px 7px 3px 3px}
.tier::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:rgba(58,0,22,.35);border-radius:0 0 3px 3px}
.tierTop{width:56%;height:44px;
  background:linear-gradient(180deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.06) 26%,rgba(120,10,50,0) 58%,rgba(120,10,50,.30) 100%),
    radial-gradient(ellipse 72% 60% at 28% 16%,rgba(255,255,255,.65),rgba(255,255,255,0) 62%),
    linear-gradient(180deg,#ffe9f0 0%,#fbd0de 45%,#f7c3d4 100%)}
.tierMid{width:76%;height:46px;
  background:linear-gradient(180deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.04) 26%,rgba(120,10,50,0) 58%,rgba(120,10,50,.32) 100%),
    radial-gradient(ellipse 72% 60% at 28% 16%,rgba(255,255,255,.55),rgba(255,255,255,0) 62%),
    linear-gradient(180deg,#f2a7bd 0%,#ee97b0 45%,#e77fa2 100%)}
.tierBot{width:95%;height:52px;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.04) 26%,rgba(90,0,30,0) 58%,rgba(90,0,30,.34) 100%),
    radial-gradient(ellipse 72% 60% at 28% 16%,rgba(255,255,255,.5),rgba(255,255,255,0) 62%),
    linear-gradient(180deg,#e0508a 0%,#d6336c 48%,#c2274f 100%)}
.goldBand{height:5px;border-radius:2px;position:relative;
  background:linear-gradient(180deg,#ffe9a8 0%,#f7d774 35%,#b8860b 62%,#ffe9a8 100%)}
.goldBand::after{content:"";position:absolute;left:2px;right:2px;top:0;height:1px;background:rgba(255,255,255,.9)}
.goldBand.b1{width:58%}.goldBand.b2{width:78%}
.frosting{position:absolute;top:0;left:0;right:0;height:18px;z-index:2;border-radius:7px 7px 0 0;
  background:linear-gradient(180deg,#fffdfd 0%,#fff7f9 8px,rgba(255,247,249,0) 8px)}
.frosting::before{content:"";position:absolute;left:0;right:0;top:8px;height:12px;
  background-image:radial-gradient(circle at 9px 0px,#fff7f9 9px,rgba(0,0,0,0) 10px),
    radial-gradient(circle at 27px 0px,#fff7f9 6.5px,rgba(0,0,0,0) 7.5px);
  background-size:36px 12px;background-repeat:repeat-x}
.frosting::after{content:"";position:absolute;left:5px;right:5px;top:1px;height:2px;border-radius:2px;
  background:rgba(255,255,255,.95)}
.rose{position:absolute;width:14px;height:14px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 32%,#a3133f 0%,#c2274f 22%,#e0508a 52%,#ff9ebb 78%,#ffc2d4 100%)}
.rose::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6c8,#d4a017 70%)}
.pearl{position:absolute;width:5px;height:5px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 35% 30%,#ffffff 0%,#ffe9f0 45%,#e8b7c8 100%)}
.plate{width:108%;height:11px;border-radius:50%;margin-top:-1px;
  background:radial-gradient(ellipse at 50% 32%,#fff3c4 0%,#f7d774 38%,#c9971c 68%,#8a6410 100%)}
.stem{width:16px;height:12px;background:linear-gradient(90deg,#8a6410,#f7d774 45%,#c9971c)}
.base{width:74px;height:7px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%,#ffe9a8 0%,#e9c25e 45%,#b8860b 100%)}
#cakeGap{position:absolute;right:3px;bottom:30px;width:60px;height:152px;z-index:4;pointer-events:none;
  clip-path:polygon(21.7% 0,31.7% 0,31.7% 29%,65% 29%,65% 65%,96.7% 65%,96.7% 100%,21.7% 100%);
  background:linear-gradient(90deg,#2a0410 0%,#6b1830 55%,#3d0716 100%);opacity:0;transition:opacity .4s}
#cakeGap.show{opacity:1}
#sliceEl{position:absolute;right:3px;bottom:30px;width:32px;height:152px;z-index:5;cursor:pointer;
  clip-path:polygon(0 16%,100% 0,100% 100%,0 84%);

<script>
(function(){
"use strict";
/* — admin-editable name: Shaheer can change "Princess" here later (or via the admin panel) — */
const PRINCESS_NAME = "Princess";
const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const cv = document.getElementById('sky');
const ctx = cv.getContext('2d');
const finaleBtn = document.getElementById('finaleBtn');
const tapHint = document.getElementById('tapHint');
const pageHead = document.getElementById('pageHead');
const princessEl = document.getElementById('princessName');
const letterEl = document.getElementById('letterLine');
const turnEl = document.getElementById('turnHint');
const musicBtn = document.getElementById('musicBtn');
const cakeWrap = document.getElementById('cakeWrap');
const cakeEl = document.getElementById('cake');
const sliceEl = document.getElementById('sliceEl');
const cakeGap = document.getElementById('cakeGap');
const cakeHint = document.getElementById('cakeHint');
const yumEl = document.getElementById('yum');
const candleEls = Array.prototype.slice.call(document.querySelectorAll('.candle'));

let W = 360, H = 780, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = stage.clientWidth || 360; H = stage.clientHeight || 780;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
}
window.addEventListener('resize', resize);

/* — pre-drawn spark sprites (no blur, no shadowBlur) — */
function sprite(colorA, colorB){
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,'#ffffff'); gr.addColorStop(.25,colorA); gr.addColorStop(.6,colorB); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,32,32);
  return c;
}
const sprGold = sprite('rgba(255,216,130,.95)','rgba(219,164,44,.45)');
const sprRose = sprite('rgba(255,150,175,.95)','rgba(224,80,138,.4)');
const sprWhite = sprite('rgba(255,244,214,.95)','rgba(255,214,120,.4)');
const sprRed = sprite('#ff5a6e','rgba(214,32,64,.45)');
const sprPink = sprite('#ff9ebb','rgba(224,80,138,.4)');

/* — stars: many small, gentle twinkle (opacity only) — */
let stars = [];
function buildStars(){
  stars = [];
  const n = RM ? 30 : 72;
  for (let i = 0; i < n; i++) stars.push({ x: Math.random()*W, y: Math.random()*H*0.66, r: .6 + Math.random()*1.4, ph: Math.random()*6.28, sp: .35 + Math.random()*1.1 });
}
function drawStars(t){
  for (const s of stars){
    const a = .22 + .6 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.sp + s.ph));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffe9b0';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* — fireworks state — */
let act = 1, taps = 0, muted = false, shapeIdx = 0;
let rockets = [], sparks = [], letters = [];
let rafOn = false, lastT = 0;
const SHAPES = ['peony','willow','ring','crackle'];
const MAX_SPARKS = 420;

function launchRocket(x, y, opts){
  opts = opts || {};
  rockets.push({ x: x, y: y + 30, ty: y - (90 + Math.random()*70), vx: (Math.random()-.5)*.6,
    vy: -(7 + Math.random()*2.5), trail: [], gold: opts.gold !== false,
    shape: opts.shape || SHAPES[shapeIdx++ % SHAPES.length], burstN: opts.burstN || 0 });
}

/* Layered burst: gold core + rose secondary + crackling star sparks + gold rain trails. */
function burst(x, y, shape, gold){
  const coreN = RM ? 26 : 55, secN = RM ? 12 : 30, crkN = RM ? 8 : 20;
  const coreSpr = gold ? sprGold : sprRose, secSpr = gold ? sprRose : sprGold;
  function push(s){ sparks.push(s); if (sparks.length > MAX_SPARKS) sparks.splice(0, sparks.length - MAX_SPARKS); }
  /* gold core */
  for (let i = 0; i < coreN; i++){
    let a, sp;
    if (shape === 'ring'){ a = (i / coreN) * 6.283; sp = 3.1 + Math.random()*.35; }
    else if (shape === 'willow'){ a = Math.random()*6.283; sp = 1.4 + Math.random()*2.6; }
    else { a = Math.random()*6.283; sp = 1.2 + Math.random()*3.6; }
    push({ x:x, y:y, px:x, py:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - .6, life:1,
      decay: shape === 'willow' ? .004 + Math.random()*.005 : .008 + Math.random()*.014,
      s: 6.5 + Math.random()*7, spr: coreSpr, grav: shape === 'willow' ? .075 : .035,
      drag: .985, trail: shape === 'willow', jit: shape === 'crackle' });
  }
  /* rose secondary, slightly slower, offset angles */
  for (let i = 0; i < secN; i++){
    const a = Math.random()*6.283, sp = .8 + Math.random()*2.2;
    push({ x:x, y:y, px:x, py:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - .4, life:1,
      decay:.01 + Math.random()*.012, s: 5 + Math.random()*6, spr: secSpr, grav:.03, drag:.982, trail:false, jit:false });
  }
  /* crackling star sparks: tiny, bright, jittering */
  for (let i = 0; i < crkN; i++){
    const a = Math.random()*6.283, sp = 2 + Math.random()*3.4;
    push({ x:x, y:y, px:x, py:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1,
      decay:.02 + Math.random()*.02, s: 3.5 + Math.random()*3.5, spr: sprWhite, grav:.02, drag:.97, trail:false, jit:true });
  }
  /* gold rain trails (willow droop): slow falling gold drops */
  if (shape === 'willow'){
    for (let i = 0; i < 12; i++){
      push({ x: x + (Math.random()-.5)*70, y: y + (Math.random()-.5)*30, px:0, py:0,
        vx:(Math.random()-.5)*.4, vy: .9 + Math.random()*1.1, life:1, decay:.006 + Math.random()*.005,
        s: 4 + Math.random()*4, spr: sprGold, grav:.05, drag:.995, trail:true, jit:false });
    }
  }
}

function tick(t){
  if (!rafOn) return;
  const dt = Math.min(50, t - lastT || 16); lastT = t;
  ctx.clearRect(0, 0, W, H);
  drawStars(t);
  /* rockets */
  for (let i = rockets.length - 1; i >= 0; i--){
    const r = rockets[i];
    r.trail.push({ x: r.x, y: r.y }); if (r.trail.length > 7) r.trail.shift();
    r.x += r.vx; r.y += r.vy; r.vy += .06;
    ctx.globalAlpha = .85;
    for (let j = 0; j < r.trail.length; j++){
      const p = r.trail[j], k = j / r.trail.length;
      ctx.drawImage(r.gold ? sprGold : sprRose, p.x - 4*k - 2, p.y - 4*k - 2, 8*k + 2, 8*k + 2);
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(r.gold ? sprGold : sprRose, r.x - 6, r.y - 6, 12, 12);
    if (r.y <= r.ty || r.vy >= 0){
      rockets.splice(i, 1);
      burst(r.x, r.y, r.shape, r.gold);
      if (!muted) bloomSound();
    }
  }
  /* sparks */
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.px = s.x; s.py = s.y;
    if (s.jit){ s.vx += (Math.random()-.5)*.5; s.vy += (Math.random()-.5)*.5; }
    s.x += s.vx; s.y += s.vy; s.vy += s.grav; s.vx *= s.drag; s.vy *= s.drag; s.life -= s.decay;
    if (s.life <= 0){ sparks.splice(i, 1); continue; }
    const a = Math.max(0, s.life);
    if (s.trail){
      ctx.globalAlpha = a * .55; ctx.strokeStyle = '#ffd97a'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(s.px, s.py); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
    ctx.globalAlpha = a;
    ctx.drawImage(s.spr, s.x - s.s, s.y - s.s, s.s*2, s.s*2);
  }
  ctx.globalAlpha = 1;
  /* sky letters — glow pass (big faint sprite, opacity pulse) + bright core */
  for (let i = letters.length - 1; i >= 0; i--){
    const p = letters[i];
    if (p.state === 0){
      p.vx += (p.tx - p.x) * .024; p.vy += (p.ty - p.y) * .024;
      p.vx *= .86; p.vy *= .86; p.x += p.vx; p.y += p.vy;
      if (Math.abs(p.tx - p.x) < 3 && Math.abs(p.ty - p.y) < 3){ p.state = 1; p.x = p.tx; p.y = p.ty; }
    } else if (p.state === 1){
      p.a = .85 + .15 * Math.sin(t * .003 + p.ph);
    } else {
      p.vy += .03; p.y += p.vy; p.a -= .012;
      if (p.a <= 0){ letters.splice(i, 1); continue; }
    }
    const pulse = .16 + .10 * (0.5 + 0.5 * Math.sin(t * .0022 + p.ph));
    const lSpr = p.spr || sprRed;
    if (p.state === 1){ ctx.globalAlpha = pulse; ctx.drawImage(lSpr, p.x - p.s*2.4, p.y - p.s*2.4, p.s*4.8, p.s*4.8); }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.a));
    ctx.drawImage(lSpr, p.x - p.s, p.y - p.s, p.s*2, p.s*2);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(tick);
}
function startLoop(){ if (!rafOn){ rafOn = true; lastT = 0; requestAnimationFrame(tick); } }

/* — audio: the book's music-box engine (sine + octave sparkle) — */
let actx = null, musicGain = null, noiseBuf = null;
function ac(){
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  if (!musicGain){ musicGain = actx.createGain(); musicGain.gain.value = muted ? 0 : 1; musicGain.connect(actx.destination); }
  return actx;
}
/* NOTE table + Happy Birthday sequence, copied from the book (book-v2.html). */
const NOTE = {C4:261.63,E4:329.63,'F#4':369.99,G4:392.00,'G#4':415.30,A4:440.00,B4:493.88,'C#5':554.37,C5:523.25,D5:587.33,'D#5':622.25,E5:659.25,F5:698.46,'F#5':739.99,G5:783.99,A5:880.00,B5:987.77,C6:1046.50};
const HB = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',1.75],[0,.25],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',1.75],[0,.25],['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1.75],[0,.25],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2],[0,1]];
function boxNote(f, t, dur){
  const o1 = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain(), g2 = actx.createGain();
  o1.type = 'sine'; o1.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f*2; g2.gain.value = .32;
  const len = Math.max(dur, .9);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.14, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + len);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(musicGain);
  o1.start(t); o2.start(t); o1.stop(t + len + .1); o2.stop(t + len + .1);
}
function getNoise(){
  if (!noiseBuf){
    noiseBuf = actx.createBuffer(1, actx.sampleRate * .6, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  }
  return noiseBuf;
}
function bloomSound(){
  if (muted) return;
  try{
    ac();
    const t = actx.currentTime;
    const src = actx.createBufferSource(); src.buffer = getNoise();
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(2400, t + .28);
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.10, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + .5);
    src.connect(bp); bp.connect(g); g.connect(musicGain); src.start(t); src.stop(t + .55);
    const o = actx.createOscillator(), og = actx.createGain();
    o.type = 'sine'; o.frequency.value = 1250 + Math.random()*300;
    og.gain.setValueAtTime(.05, t + .02); og.gain.exponentialRampToValueAtTime(.0001, t + .5);
    o.connect(og); og.connect(musicGain); o.start(t + .02); o.stop(t + .55);
    /* soft crackle: a few short filtered noise ticks */
    for (let k = 0; k < 4; k++){
      const tt = t + .12 + Math.random()*.35;
      const s2 = actx.createBufferSource(); s2.buffer = getNoise();
      const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
      const g2 = actx.createGain();
      g2.gain.setValueAtTime(.045, tt); g2.gain.exponentialRampToValueAtTime(.0001, tt + .06);
      s2.connect(hp); hp.connect(g2); g2.connect(musicGain); s2.start(tt); s2.stop(tt + .08);
    }
  }catch(e){}
}
function sliceSound(){
  if (muted) return;
  try{
    ac();
    const t = actx.currentTime;
    const src = actx.createBufferSource(); src.buffer = getNoise();
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(1400, t); bp.frequency.exponentialRampToValueAtTime(320, t + .22);
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + .28);
    src.connect(bp); bp.connect(g); g.connect(musicGain); src.start(t); src.stop(t + .3);
  }catch(e){}
}
function chime(){
  if (muted) return;
  try{ ac(); const t = actx.currentTime + .05; boxNote(NOTE.E5, t, .8); boxNote(NOTE.C6, t + .22, 1.1); }catch(e){}
}

/* — sky letters: denser resampling, bigger dots, glow pass in tick() — */
function sampleLetters(){
  const twoLine = W < 430; /* two lines up to 430px so the letters stay large and crisp */
  const lines = twoLine ? ['HAPPY', 'BIRTHDAY'] : ['HAPPY BIRTHDAY'];
  const off = document.createElement('canvas');
  off.width = W; off.height = Math.round(H * .5);
  const g = off.getContext('2d');
  let fs = twoLine ? 64 : 44;
  g.font = '600 ' + fs + 'px "Playfair Display", serif';
  let widest = 0;
  lines.forEach(function(l){ widest = Math.max(widest, g.measureText(l).width); });
  if (widest > W - 44){ fs = Math.floor(fs * (W - 44) / widest); g.font = '600 ' + fs + 'px "Playfair Display", serif'; }
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const cy = twoLine ? H * .22 : H * .26;
  if (twoLine){ g.fillText(lines[0], W/2, cy); g.fillText(lines[1], W/2, cy + fs * 1.08); }
  else g.fillText(lines[0], W/2, cy);
  const data = g.getImageData(0, 0, off.width, off.height).data;
  /* denser resampling: step down until the letters hold ~180+ sparks (cap 220) */
  let pts = [];
  for (const step of [5, 4, 3]){
    pts = [];
    for (let y = 0; y < off.height; y += step){
      for (let x = 0; x < off.width; x += step){
        if (data[(y * off.width + x) * 4 + 3] > 120) pts.push({ x: x, y: y });
      }
    }
    if (pts.length >= 180 || step === 3) break;
  }
  /* cap at 220, evenly strided so the letters stay whole and dense */
  if (pts.length <= 220) return pts;
  const out = [], stride = pts.length / 220;
  for (let i = 0; i < 220; i++) out.push(pts[Math.floor(i * stride)]);
  return out;
}

/* — acts — */
let letterPts = [], letterIdx = 0, shellTimer = null, melodyTimers = [], cascadeTimers = [];
function setAct(n){ act = n; stage.setAttribute('data-act', String(n)); }

function startFinale(){
  if (act !== 1) return;
  setAct(2);
  finaleBtn.classList.remove('show');
  tapHint.style.opacity = '0';
  pageHead.classList.add('dim');
  cakeWrap.classList.add('show');
  letterPts = sampleLetters(); letterIdx = 0;
  try{ ac(); if (musicGain) musicGain.gain.value = muted ? 0 : 1; }catch(e){}
  const t0 = actx ? actx.currentTime + .1 : 0;
  const beat = .40;
  const onsets = [];
  let t = t0;
  HB.forEach(function(s){
    onsets.push(t);
    if (s[0] && !muted) boxNote(NOTE[s[0]], t, s[1] * beat);
    t += s[1] * beat;
  });
  const total = t - t0;
  /* shells in rhythm with the melody */
  shellTimer = setInterval(function(){
    launchRocket(40 + Math.random()*(W-80), H * (.30 + Math.random()*.25), { gold: Math.random() < .7 });
  }, 470);
  /* letter sparks fly in during the final phrase (last ~6 notes) */
  const finalStart = onsets[onsets.length - 6];
  const batch = Math.ceil(letterPts.length / 6);
  for (let k = 0; k < 6; k++){
    melodyTimers.push(setTimeout(function(){
      const end = Math.min(letterPts.length, letterIdx + batch);
      for (; letterIdx < end; letterIdx++){
        const p = letterPts[letterIdx];
        letters.push({ x: 30 + Math.random()*(W-60), y: H * (.12 + Math.random()*.3), vx: 0, vy: 0, tx: p.x, ty: p.y, s: 6.5 + Math.random()*3.5, a: .95, ph: Math.random()*6.28, state: 0, spr: (letterIdx % 2 === 0 ? sprRed : sprPink) });
      }
    }, Math.max(0, (finalStart + k * .42 - (actx ? actx.currentTime : 0)) * 1000)));
  }
  /* GRAND CASCADE — several shells in quick succession as the melody ends */
  melodyTimers.push(setTimeout(function(){
    if (shellTimer){ clearInterval(shellTimer); shellTimer = null; }
    for (let k = 0; k < 6; k++){
      cascadeTimers.push(setTimeout(function(){
        launchRocket(36 + (k % 3) * (W-72)/2 + (Math.random()-.5)*30, H * (.28 + Math.random()*.22), { gold: k % 2 === 0 });
      }, k * 170));
    }
    cascadeTimers.push(setTimeout(function(){
      launchRocket(W * .5, H * .30, { gold: true });
      launchRocket(W * .22, H * .34, { gold: false });
      launchRocket(W * .78, H * .34, { gold: false });
    }, 6 * 170 + 120));
  }, total * 1000));
  /* candles light in rhythm: first four across the final phrase, last on the final note */
  for (let k = 0; k < 4; k++){
    melodyTimers.push(setTimeout(function(){ lightCandle(k); },
      Math.max(0, (finalStart + k * .42 - (actx ? actx.currentTime : 0)) * 1000)));
  }
  melodyTimers.push(setTimeout(function(){ lightCandle(4); }, total * 1000));
  melodyTimers.push(setTimeout(function(){
    if (act === 2){ cakeHint.textContent = 'Tap to cut a slice'; cakeHint.classList.add('show'); }
  }, total * 1000 + 400));
  melodyTimers.push(setTimeout(function(){
    princessEl.textContent = PRINCESS_NAME;
    princessEl.classList.add('show');
  }, total * 1000 + 900));
  melodyTimers.push(setTimeout(startAct3, total * 1000 + 3600));
}
/* — V4 cake: light, cut, eat — */
let cakeCut = false, bites = 0, yumTimer = null;
function lightCandle(i){
  const c = candleEls[i];
  if (c) c.classList.add('lit');
}
function crumbBurst(x, y){
  if (RM) return;
  for (let k = 0; k < 7; k++){
    const d = document.createElement('span');
    d.className = 'crumb';
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.style.setProperty('--dx', ((Math.random()-.5)*56).toFixed(0) + 'px');
    d.style.setProperty('--dy', (-(8 + Math.random()*26)).toFixed(0) + 'px');
    sliceEl.appendChild(d);
    setTimeout(function(){ d.remove(); }, 750);
  }
}
function cutCake(){
  if (cakeCut || !cakeWrap.classList.contains('show')) return;
  cakeCut = true;
  sliceEl.classList.add('cut');
  cakeGap.classList.add('show');
  sliceSound();
  cakeHint.textContent = 'Tap the slice to eat it';
  cakeHint.classList.add('show');
}
function eatSlice(e){
  if (!cakeCut || bites >= 3) return;
  bites++;
  const r = sliceEl.getBoundingClientRect();
  const x = (e && e.clientX ? e.clientX - r.left : r.width / 2);
  const y = (e && e.clientY ? e.clientY - r.top : r.height / 2);
  crumbBurst(x, y);
  if (bites === 1) sliceEl.classList.add('bite1');
  else if (bites === 2) sliceEl.classList.add('bite2');
  else {
    sliceEl.classList.add('gone');
    yumEl.classList.add('show');
    cakeHint.textContent = 'A slice for you';
    if (yumTimer) clearTimeout(yumTimer);
    yumTimer = setTimeout(function(){ yumEl.classList.remove('show'); }, 1800);
    setTimeout(function(){ cakeHint.classList.remove('show'); }, 2600);
  }
}
cakeEl.addEventListener('click', function(e){
  if (e.target.closest('#sliceEl')) return;
  if (act !== 2 && act !== 3) return;
  cutCake();
});
sliceEl.addEventListener('click', function(e){
  e.stopPropagation();
  if (act !== 2 && act !== 3) return;
  eatSlice(e);
});
function startAct3(){
  if (act !== 2) return;
  setAct(3);
  pageHead.classList.remove('dim');
  princessEl.classList.remove('show');
  letters.forEach(function(p){ if (p.state === 1) p.state = 2; });
  setTimeout(function(){
    letterEl.classList.add('show');
    turnEl.classList.add('show');
    chime();
  }, 900);
}
function resetDemo(){
  setAct(1); taps = 0;
  rockets = []; sparks = []; letters = [];
  if (shellTimer){ clearInterval(shellTimer); shellTimer = null; }
  melodyTimers.forEach(clearTimeout); melodyTimers = [];
  cascadeTimers.forEach(clearTimeout); cascadeTimers = [];
  if (musicGain && actx){ try{ musicGain.gain.setTargetAtTime(0, actx.currentTime, .05); }catch(e){} }
  finaleBtn.classList.remove('show');
  tapHint.style.opacity = '1';
  pageHead.classList.remove('dim');
  cakeWrap.classList.remove('show');
  cakeGap.classList.remove('show');
  sliceEl.classList.remove('cut', 'bite1', 'bite2', 'gone');
  cakeHint.classList.remove('show');
  cakeHint.textContent = 'Tap to cut a slice';
  yumEl.classList.remove('show');
  candleEls.forEach(function(c){ c.classList.remove('lit'); });
  if (yumTimer){ clearTimeout(yumTimer); yumTimer = null; }
  cakeCut = false; bites = 0;
  princessEl.classList.remove('show');
  letterEl.classList.remove('show');
  turnEl.classList.remove('show');
}

/* — input — */
stage.addEventListener('pointerdown', function(e){
  if (e.target.closest('button')) return;
  if (act !== 1) return;
  const r = stage.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  launchRocket(x, y, { gold: Math.random() < .65 });
  taps++;
  if (taps >= 3) finaleBtn.classList.add('show');
});
finaleBtn.addEventListener('click', startFinale);
document.getElementById('replayBtn').addEventListener('click', resetDemo);
musicBtn.addEventListener('click', function(){
  muted = !muted;
  musicBtn.classList.toggle('muted', muted);
  if (musicGain) musicGain.gain.value = muted ? 0 : 1;
});
if (document.fonts && document.fonts.load){
  document.fonts.load('600 100px "Playfair Display"').catch(function(){});
  document.fonts.load('400 46px "Great Vibes"').catch(function(){});
}
resize();
startLoop();
window.__ch12 = {
  state: function(){ return { act: act, taps: taps, rockets: rockets.length, sparks: sparks.length, letters: letters.length, muted: muted,
    cakeShown: cakeWrap.classList.contains('show'), cakeCut: cakeCut, bites: bites,
    candlesLit: candleEls.filter(function(c){ return c.classList.contains('lit'); }).length,
    sliceGone: sliceEl.classList.contains('gone'), hintShown: cakeHint.classList.contains('show') }; },
  letterCount: function(){ return letters.length; }
};
})();
</script>
