<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Something for You</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#eec9cd;overflow:hidden;font-family:Georgia,serif}
  .stage{position:fixed;inset:0}
  .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  /* REAL HTML button over the painted plaque */
  .plaqueBtn{position:absolute;left:50%;top:88.4%;width:68%;aspect-ratio:5.6/1;transform:translate(-50%,-50%);
    border:none;border-radius:999px;cursor:pointer;background:transparent;
    box-shadow:0 0 0 rgba(255,170,190,0);animation:breathe 3.2s ease-in-out infinite}
  .plaqueBtn:active{transform:translate(-50%,-50%) scale(.965)}
  @keyframes breathe{0%,100%{box-shadow:0 0 12px 2px rgba(255,190,205,.25)}50%{box-shadow:0 0 30px 8px rgba(255,170,195,.55)}}
  .envZone{position:absolute;left:45%;top:78%;width:58%;aspect-ratio:1.9/1;transform:translate(-50%,-50%);
    border:none;border-radius:10px;cursor:pointer;background:transparent}
  .envZone:active{background:rgba(255,240,245,.12)}
  .sparkle{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(circle,#fff6da 0%,rgba(255,214,150,.65) 42%,transparent 70%);animation:tw 3.6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
  .petal{position:absolute;pointer-events:none;background:linear-gradient(135deg,#f7b8c6,#ee93ab);
    border-radius:80% 4px 80% 4px;opacity:.7;animation:fall linear infinite}
  @keyframes fall{0%{transform:translateY(-4vh) rotate(0deg)}100%{transform:translateY(104vh) rotate(300deg)}}
  .burstPetal{position:fixed;z-index:9;pointer-events:none;background:linear-gradient(135deg,#f9c6d2,#ef9db4);border-radius:80% 4px 80% 4px}
  @media (prefers-reduced-motion: reduce){.plaqueBtn,.sparkle,.petal{animation:none}}
</style>

<script>
  function burst(x, y, n){
    for (var i=0;i<n;i++){
      var p=document.createElement('span'); p.className='burstPetal';
      var s=6+Math.random()*7; p.style.width=s+'px'; p.style.height=(s*1.35)+'px';
      p.style.left=x+'px'; p.style.top=y+'px';
      document.body.appendChild(p);
      var a=Math.random()*Math.PI*2, d=50+Math.random()*85;
      p.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},
                 {transform:'translate('+(Math.cos(a)*d)+'px,'+(Math.sin(a)*d+36)+'px) rotate('+(Math.random()*260-130)+'deg)',opacity:0}],
                {duration:850+Math.random()*450, easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=(function(el){return function(){el.remove()}})(p);
    }
  }
  document.getElementById('openBtn').addEventListener('click', function(e){ burst(e.clientX, e.clientY, 16); });
  document.getElementById('envBtn').addEventListener('click', function(e){ burst(e.clientX, e.clientY, 8); });
</script>
