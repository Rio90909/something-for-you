    filter:drop-shadow(0 10px 14px rgba(126,47,69,.18))}
  .polas{display:flex;gap:7px;justify-content:center;width:100%;position:relative;z-index:2;margin-top:.4dvh}
  .pola{background:#fffdf9;padding:4px 4px 1px;width:31.8%;box-shadow:0 7px 14px rgba(126,47,69,.22);border-radius:2px}
  .pola img{width:100%;display:block}
  .pola span{display:block;font-size:10px;color:#c05a78;line-height:1.45}
  .pola:nth-child(1){transform:rotate(-2.4deg)} .pola:nth-child(3){transform:rotate(2.4deg)}
  .envwrap{position:relative;width:88%;z-index:2;margin-top:1.2dvh}
  .envelope{display:block;width:100%;filter:drop-shadow(0 12px 16px rgba(126,47,69,.22))}
  .bfly{position:absolute;right:-16px;bottom:-12px;width:44px;filter:drop-shadow(0 4px 8px rgba(126,47,69,.25))}
  .btn{display:block;width:92%;margin-top:auto;position:relative;overflow:hidden;cursor:pointer;z-index:5;
    border:1.5px solid #a87c2e;border-radius:12px;padding:1.7dvh 10px;
    font-family:'Playfair Display',serif;font-size:clamp(17px,5.2vw,20px);font-weight:600;letter-spacing:.05em;color:#fff8ea;
    background:linear-gradient(180deg,#eda0b4,#d6708c 55%,#c25677);
    box-shadow:inset 0 0 0 3px rgba(255,248,234,.32), inset 0 1px 0 rgba(255,255,255,.6),
      0 0 20px rgba(214,112,140,.45), 0 10px 22px rgba(126,47,69,.30);text-shadow:0 1px 3px rgba(126,47,69,.4)}
  .btn:active{transform:scale(.98)}
  .btn::after{content:"";position:absolute;top:0;bottom:0;width:44px;left:-80px;transform:skewX(-18deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:sheen 4.5s ease-in-out infinite}
  @keyframes sheen{0%,50%{left:-80px}82%,100%{left:112%}}
  .foot{margin-top:1dvh;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#a06a52;position:relative;z-index:2}
  .sparkle{position:absolute;border-radius:50%;pointer-events:none;z-index:2;
    background:radial-gradient(circle,rgba(255,248,234,.95) 0%,rgba(255,220,150,.55) 42%,transparent 70%);
    animation:tw 3.6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
  .burstPetal{position:fixed;z-index:9;pointer-events:none;background:linear-gradient(135deg,#f9c6d2,#ef9db4);border-radius:80% 4px 80% 4px}
  @media (prefers-reduced-motion: reduce){.btn::after,.sparkle{animation:none}}
</style>
