  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#e2a7b3;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Jost',sans-serif}
  .phone{position:relative;width:100%;max-width:420px;height:100dvh;margin:0 auto;overflow:hidden;perspective:1700px;background:#f7ead9}
  /* — Chapter Fourteen: the book's cream page, exactly like pages 2-3 — */
  #page14{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5dvh 8vw 11dvh;background:radial-gradient(115% 68% at 50% -4%,rgba(255,196,210,.65),rgba(255,196,210,0) 60%),radial-gradient(95% 58% at 50% 110%,rgba(243,148,172,.42),rgba(243,148,172,0) 62%),radial-gradient(72% 46% at 50% 47%,rgba(255,170,190,.5),rgba(255,170,190,0) 70%),linear-gradient(180deg,#fdf3e7,#f9e6d3 55%,#f0d9c2)}
  #page14::before{content:"";position:absolute;inset:12px;border:2px solid rgba(178,132,62,.55);border-radius:8px;pointer-events:none;z-index:6}
  #page14::after{content:"";position:absolute;inset:17px;border:1px solid rgba(178,132,62,.3);border-radius:5px;pointer-events:none;z-index:6}
  #bgheart{position:absolute;left:50%;top:47%;width:350px;height:338px;transform:translate(-50%,-50%);opacity:.05;z-index:0;pointer-events:none}
  .hcanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  #risers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  #petalsOnce{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .chaphead{position:absolute;top:4.5dvh;left:0;right:0;z-index:2;text-align:center;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:#a06a52}
  .content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:320px}
  .line{font-family:'Playfair Display',serif;font-style:italic;font-size:17.5px;line-height:1.75;color:#6e2f2a;opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease;margin-top:1dvh}
  .line.show{opacity:1;transform:none}
  #l0{margin-top:0}
  .goldwrap{position:relative;margin-top:4.5dvh}
  .goldglow{position:absolute;left:50%;top:50%;width:340px;height:160px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,51,85,.45) 0%,rgba(255,51,85,.15) 45%,rgba(255,51,85,0) 70%);opacity:0;transition:opacity .8s ease;pointer-events:none}
  .goldglow.on{opacity:.5;animation:goldGlow 1.6s ease-in-out infinite}
  @keyframes goldGlow{0%{opacity:.42}9%{opacity:.68}19%{opacity:.48}29%{opacity:.6}41%{opacity:.48}100%{opacity:.42}}
  .gold{font-family:'Great Vibes',cursive;font-weight:400;font-size:46px;line-height:1.2;position:relative;z-index:1;opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease;background:linear-gradient(100deg,#e01030,#c4042c 34%,#ff8296 50%,#e01030 64%,#8f0220);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;text-shadow:0 1px 2px rgba(143,2,32,.25)}
  .gold.show{opacity:1;transform:none;animation:shimmer 3s linear infinite}
  @keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
  .after{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;line-height:1.65;color:#6e2f2a;max-width:300px;margin-top:1.4dvh;opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease}
  .after.show{opacity:1;transform:none}
  .heartwrap{margin-top:1.6dvh;opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease;position:relative;width:168px;height:162px}
  .heartwrap.show{opacity:1;transform:none}
  .heartpulse{position:absolute;inset:0;transform-origin:50% 55%;animation:heartbeat 1.6s ease-in-out infinite}
  .heartwrap.holding .heartpulse{animation-duration:.95s}
  @keyframes heartbeat{0%{transform:scale(1)}9%{transform:scale(1.085)}19%{transform:scale(1.005)}29%{transform:scale(1.052)}41%{transform:scale(1)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){.heartpulse{animation:none}.gold.show{animation:none}.goldglow.on{animation:none}.heartwrap.holding .ring{animation:none}.sat{animation:none}.heartaura{animation:none}.sheenrect{animation:none}.heartwrap.blasted .heartpulse{transition:opacity .9s ease;transform:none}#hintTxt{animation:none;opacity:.9}#page14 .heartwrap.charged{animation:none}}
  .ring{position:absolute;inset:-9px;border:2px solid rgba(217,87,110,.45);border-radius:50%;opacity:0;pointer-events:none}
  .heartwrap.holding .ring{animation:ringPulse 1.15s ease-out infinite}
  .heartwrap.holding .ring.r2{animation-delay:.55s}
  @keyframes ringPulse{0%{transform:scale(.7);opacity:.5}100%{transform:scale(1.45);opacity:0}}
  .heartscale{position:absolute;inset:0;will-change:transform}
  .heartglow{position:absolute;inset:-58px;border-radius:50%;background:radial-gradient(circle,rgba(255,175,115,.85) 0%,rgba(255,115,135,.42) 46%,rgba(255,115,135,0) 70%);opacity:0;pointer-events:none}
  .heartaura{position:absolute;inset:-48px;border-radius:50%;background:radial-gradient(circle,rgba(255,110,140,.5) 0%,rgba(240,70,105,.22) 45%,rgba(240,70,105,0) 70%);opacity:.32;pointer-events:none;animation:glowBeat 1.6s ease-in-out infinite}
  @keyframes glowBeat{0%{opacity:.38}9%{opacity:.68}19%{opacity:.46}29%{opacity:.6}41%{opacity:.42}100%{opacity:.38}}
  .heartwrap.holding .heartaura{animation-duration:.95s}
  .sat{position:absolute;pointer-events:none;animation:satBob 4s ease-in-out infinite}
  @keyframes satBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
  .sat.s1{width:21px;left:-32px;top:4px;opacity:.7;animation-duration:3.8s}
  .sat.s2{width:15px;right:-27px;top:-14px;opacity:.55;animation-duration:4.4s;animation-delay:.6s}
  .sat.s3{width:17px;right:-34px;bottom:14px;opacity:.65;animation-duration:4.1s;animation-delay:1.1s}
  .sat.s4{width:13px;left:-24px;bottom:-10px;opacity:.5;animation-duration:3.5s;animation-delay:.3s}
  .sheenrect{animation:sheenMove 5.4s ease-in-out infinite;opacity:0}
  @keyframes sheenMove{0%{transform:translateX(0) skewX(-16deg);opacity:0}4%{opacity:.5}17%{transform:translateX(250px) skewX(-16deg);opacity:0}100%{transform:translateX(250px) skewX(-16deg);opacity:0}}
  .heartscale>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .heartgold{opacity:0}
  .heartwrap.blasted .heartpulse{animation:none;transform:scale(1.3);opacity:0;transition:transform .16s ease-out,opacity .16s ease-out}
  .heartwrap.blasted .ring{display:none}
  .heartwrap.blasted .sat{opacity:0;transition:opacity .3s ease}
  .thanks{pointer-events:none;font-family:'Great Vibes',cursive;font-size:30px;line-height:1.25;color:#a31621;margin-top:-148px;opacity:0;transform:translateY(12px);transition:opacity .9s ease,transform .9s ease}
  .thanks.show{opacity:1;transform:none}
  .thanks2{pointer-events:none;font-family:'Playfair Display',serif;font-style:italic;font-size:15.5px;line-height:1.6;color:#6e2f2a;max-width:300px;margin-top:1dvh;opacity:0;transform:translateY(12px);transition:opacity .9s ease,transform .9s ease}
  .thanks2.show{opacity:1;transform:none}
  .theend{margin-top:2.6dvh;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#a06a52;opacity:0;transition:opacity .8s ease}
  .theend.show{opacity:1}
  .from{margin-top:1.6dvh;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#a06a52;opacity:0;transition:opacity .8s ease}
  .from.show{opacity:1}
  .from b{color:#a34a63;font-weight:500}
  .hint{position:absolute;bottom:9.5dvh;left:0;right:0;z-index:2;text-align:center;font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#a34a63;opacity:.85;transition:opacity .25s ease}
  .hint.hide{opacity:0}
  .hint span{display:inline-block;animation:hintBreathe 2.2s ease-in-out infinite}
  @keyframes hintBreathe{0%,100%{opacity:.45}50%{opacity:.95}}
  .heartwrap.charged{animation:chargeShake .12s linear infinite}
  @keyframes chargeShake{0%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(.8px,-.6px) rotate(.35deg)}50%{transform:translate(-.7px,.5px) rotate(-.3deg)}75%{transform:translate(.6px,.7px) rotate(.25deg)}100%{transform:translate(0,0) rotate(0deg)}}
  .pagenum{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:5;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.3em;color:#a06a52}
  /* — The closing cover: the book's own painting, swinging in on its spine — */
  #closer{position:absolute;inset:0;z-index:10;transform-origin:0% 50%;backface-visibility:hidden;will-change:transform;transform:rotateY(-104deg);pointer-events:none}
  #closer .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;-webkit-user-drag:none;pointer-events:none}
  #closer .shade{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4;background:linear-gradient(90deg, rgba(70,20,35,.5) 0%, transparent 30%)}
  #closer.closing{transition:transform 1.7s cubic-bezier(.38,.12,.3,1);transform:rotateY(0deg)}
  #closer.closing .shade{transition:opacity 1.7s ease;opacity:.55}
</style>

<script>
  /* ═══ CHAPTER 14 COPY — every word on this page lives here.
     In the admin phase these constants are what Shaheer edits. ═══ */
  var COPY = {
    chapterLabel : "· Chapter Fourteen ·",
    line0        : "And so, we come to the last page…",
    line1        : "If this little book could speak, it would say just one thing…",
    line2        : "That it was never made for the world.",
    line3        : "Every page, every wish, every rose, every word —",
    goldLine     : "Made only for you.",
    afterLine    : "Today, tomorrow, and every day after — this little book will be here, waiting for you.",
    hintTap      : "tap…",
    hintHold     : "hold the heart…",
    hintClose    : "tap to close the book…",
    thanksLine   : "Thank you for reading this book.",
    thanksLine2  : "Come back every day — this little book will be waiting for you.",
    thanksDelayMs: 1400,   // breath after the blast before the thank-you lines
    theEnd       : "The End",
    fromLine     : "From — <b>Someone who adores you</b> · 2026",
    holdMs       : 1300,   // how long she holds the heart
    breathMs     : 4800    // quiet time with The End fully on screen before the book closes itself (a tap closes it sooner)
  };

  document.getElementById('chapHead').textContent = COPY.chapterLabel;
  document.getElementById('l0').textContent = COPY.line0;
  document.getElementById('l1').textContent = COPY.line1;
  document.getElementById('l2').textContent = COPY.line2;
  document.getElementById('l3').textContent = COPY.line3;
  document.getElementById('gold').textContent = COPY.goldLine;
  document.getElementById('after').textContent = COPY.afterLine;
  document.getElementById('theend').textContent = COPY.theEnd;
  document.getElementById('fromline').innerHTML = COPY.fromLine;
  document.getElementById('thanks').textContent = COPY.thanksLine;
  document.getElementById('thanks2').textContent = COPY.thanksLine2;
  var hintEl = document.getElementById('hint');
  var hintTxt = document.getElementById('hintTxt');
  hintTxt.textContent = COPY.hintTap;

  /* Hints crossfade: fade fully out, swap while invisible, fade back in —
     never two hint lines ghosting on top of each other. */
  function setHint(txt){
    if (hintTxt.textContent === txt && txt){ hintEl.classList.remove('hide'); return; }
    hintEl.classList.add('hide');
    setTimeout(function(){
      hintTxt.textContent = txt;
      if (txt) hintEl.classList.remove('hide');
    }, 260);
  }

  /* — Floating hearts: the book's own engine, copied from book-v2.html — */
  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function heartSprite(color){
    var c=document.createElement('canvas'); c.width=c.height=48;
    var x=c.getContext('2d'); x.translate(24,13); x.scale(1.5,1.5);
    x.beginPath();
    x.moveTo(0,4);
    x.bezierCurveTo(0,1,-3,-2,-6,-2);
    x.bezierCurveTo(-10,-2,-12,1,-12,4);
    x.bezierCurveTo(-12,8,-6,11,0,16);
    x.bezierCurveTo(6,11,12,8,12,4);
    x.bezierCurveTo(12,1,10,-2,6,-2);
    x.bezierCurveTo(3,-2,0,1,0,4);
    x.closePath(); x.fillStyle=color; x.fill();
    return c;
  }
  function makeHearts(canvas){
    if (RM || !canvas) return { start:function(){}, stop:function(){} };
    var ctx=canvas.getContext('2d'), W=0, H=0, parts=[], raf=null;
    var sprites=[heartSprite('#e0455f'), heartSprite('#c2183f'), heartSprite('#f08090'), heartSprite('#e77e9f')];
    function spawn(init){
      return { x:Math.random()*W, y:init? Math.random()*H : H+20, s:8+Math.random()*10,
               v:.18+Math.random()*.3, ph:Math.random()*6.28, pa:.22+Math.random()*.33,
               rot:(Math.random()-.5)*.6, spr:sprites[(Math.random()*sprites.length)|0] };
    }
    function frame(t){
      ctx.clearRect(0,0,W,H);
      for (var i=0;i<parts.length;i++){
        var p=parts[i];
        p.y-=p.v; p.x+=Math.sin(t/1500+p.ph)*.16;
        if (p.y<-22){ var np=spawn(false); for (var k in np) p[k]=np[k]; }
        ctx.save(); ctx.globalAlpha=p.pa; ctx.translate(p.x,p.y); ctx.rotate(p.rot + Math.sin(t/1800+p.ph)*.12);
        ctx.drawImage(p.spr, -p.s, -p.s, p.s*2, p.s*2); ctx.restore();
      }
      raf=requestAnimationFrame(frame);
    }
    return {
      start:function(){
        if (raf) return;
        var r=canvas.parentElement.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1, 2);
        W=r.width; H=r.height; canvas.width=W*d; canvas.height=H*d; ctx.setTransform(d,0,0,d,0,0);
        if (!parts.length){ for (var i=0;i<14;i++) parts.push(spawn(true)); }
        raf=requestAnimationFrame(frame);
      },
      stop:function(){ if (raf) cancelAnimationFrame(raf); raf=null; ctx.clearRect(0,0,W,H); }
    };
  }
  var hearts14 = makeHearts(document.getElementById('hearts14'));
  hearts14.start();

  /* — Petals, once: a single soft drift when the hold completes — */
  function petalsOnce(){
    if (RM) return;
    var canvas=document.getElementById('petalsOnce'), ctx=canvas.getContext('2d');
    var r=canvas.parentElement.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2);
    var W=r.width, H=r.height; canvas.width=W*d; canvas.height=H*d; ctx.setTransform(d,0,0,d,0,0);
    var spr=document.createElement('canvas'); spr.width=spr.height=48;
    var sx=spr.getContext('2d'); sx.translate(24,24); sx.rotate(.7);
    sx.beginPath(); sx.ellipse(0,0,13,7.5,0,0,6.29); sx.fillStyle='#ef9db4'; sx.fill();
    var ps=[], i;
    for (i=0;i<18;i++) ps.push({ x:Math.random()*W, y:-20-Math.random()*H*.45, s:7+Math.random()*8,
      v:.5+Math.random()*.6, ph:Math.random()*6.28, rot:Math.random()*6.28, a:.35+Math.random()*.3 });
    var t0=performance.now();
    (function frame(t){
      var el=(t-t0)/1000; ctx.clearRect(0,0,W,H);
      var alive=false;
      for (var j=0;j<ps.length;j++){ var p=ps[j];
        p.y+=p.v; p.x+=Math.sin(el*1.4+p.ph)*.4; p.rot+=.004;
        if (p.y<H+24) alive=true;
        ctx.save(); ctx.globalAlpha=p.a*Math.min(1,Math.max(0,(H+10-p.y)/90)); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.drawImage(spr,-p.s,-p.s,p.s*2,p.s*2); ctx.restore();
      }
      if (alive && el<9) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
    })(t0);
  }

  /* — Rising hearts: on each heartbeat a few tiny hearts lift off the big
     heart and float up, fading — and a soft burst when her hold completes.
     Sprites are the book's own heart path, drawn once in reds/pinks/gold. — */
  var risers = (function(){
    var canvas=document.getElementById('risers'), ctx=canvas.getContext('2d');
    var W=0, H=0, parts=[], raf=null, beating=false, lastBeat=0;
    var sprs=[heartSprite('#e0455f'), heartSprite('#f2768f'), heartSprite('#c2183f'), heartSprite('#eda93f')];
    function glowSprite(inner, outer){
      var c=document.createElement('canvas'); c.width=c.height=64;
      var x=c.getContext('2d'); var g=x.createRadialGradient(32,32,2,32,32,30);
      g.addColorStop(0,inner); g.addColorStop(.4,outer); g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g; x.fillRect(0,0,64,64); return c;
    }
    var sparkSpr=glowSprite('rgba(255,255,255,1)','rgba(255,190,120,.55)');
    var flashSpr=glowSprite('rgba(255,255,255,1)','rgba(255,150,170,.5)');
    var petalSpr=(function(){ var c=document.createElement('canvas'); c.width=c.height=48; var x=c.getContext('2d'); x.translate(24,24); x.rotate(.7); x.beginPath(); x.ellipse(0,0,13,7.5,0,0,6.29); x.fillStyle='#ef9db4'; x.fill(); return c; })();
    function size(){ var r=canvas.parentElement.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2); W=r.width; H=r.height; canvas.width=W*d; canvas.height=H*d; ctx.setTransform(d,0,0,d,0,0); }
    function heartPos(){ var page=document.getElementById('page14').getBoundingClientRect(); var h=document.getElementById('heartwrap').getBoundingClientRect(); return { x:h.left-page.left+h.width/2, y:h.top-page.top+h.height*.22, cy:h.top-page.top+h.height*.48, w:h.width }; }
    function spawn(n, burst){
      var c=heartPos();
      for (var i=0;i<n;i++){
        var a=-Math.PI/2+(Math.random()-.5)*(burst?2.4:1.1);
        var sp=burst? (.6+Math.random()*1.1) : (.35+Math.random()*.4);
        parts.push({ x:c.x+(Math.random()-.5)*c.w*.5, y:c.y+(Math.random()-.5)*10,
          vx:Math.cos(a)*sp*.55, vy:Math.sin(a)*sp, s:6+Math.random()*7,
          life:0, ttl:1900+Math.random()*1100, ph:Math.random()*6.28, rot:(Math.random()-.5)*.5,
          spr:sprs[(Math.random()*sprs.length)|0] });
      }
    }
    var flash=null, ring=null;
    function frame(t){
      ctx.clearRect(0,0,W,H);
      if (beating && t-lastBeat>1600){ lastBeat=t; if (Math.random()<.6) spawn(2+((Math.random()*2)|0), false); }
      if (flash){
        var fp=(t-flash.t0)/420;
        if (fp>=1) flash=null;
        else { ctx.save(); ctx.globalAlpha=.9*(1-fp); var fs=60+fp*230;
          ctx.translate(flash.x,flash.y); ctx.drawImage(flashSpr,-fs,-fs,fs*2,fs*2); ctx.restore(); }
      }
      if (ring){
        var rp=(t-ring.t0)/950;
        if (rp>=1) ring=null;
        else { ctx.save(); ctx.globalAlpha=.5*(1-rp); ctx.strokeStyle='#ff5f7e'; ctx.lineWidth=3.5*(1-rp)+.6;
          ctx.beginPath(); ctx.arc(ring.x,ring.y,14+rp*Math.min(W,H)*.44,0,6.29); ctx.stroke(); ctx.restore(); }
      }
      parts=parts.filter(function(p){ return p.life<p.ttl; });
      for (var i=0;i<parts.length;i++){ var p=parts[i]; p.life+=16.7;
        if (p.mode==='blast'){
          p.vy+=.0028; p.vx*=.992; p.vy*=.996;
          p.x+=p.vx; p.y+=p.vy; p.rot+=p.rv;
          var bp=p.life/p.ttl, ba=bp<.06? bp/.06 : 1-Math.max(0,(bp-.55)/.45);
          ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,ba))*.95; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
          ctx.drawImage(p.spr,-p.s,-p.s,p.s*2,p.s*2); ctx.restore();
        } else {
          p.x+=p.vx+Math.sin(p.life/340+p.ph)*.3; p.y+=p.vy; p.vy-=.0015;
          var pr=p.life/p.ttl, al=pr<.15? pr/.15 : 1-(pr-.15)/.85;
          ctx.save(); ctx.globalAlpha=Math.max(0,al)*.85; ctx.translate(p.x,p.y); ctx.rotate(p.rot+Math.sin(p.life/400+p.ph)*.15);
          ctx.drawImage(p.spr,-p.s,-p.s,p.s*2,p.s*2); ctx.restore();
        }
      }
      if (beating || parts.length || flash || ring) raf=requestAnimationFrame(frame);
      else { raf=null; ctx.clearRect(0,0,W,H); }
    }
    function blast(){
      if (!W) size();
      var c=heartPos(), now=performance.now();
      if (RM){
        /* reduced motion: no explosion — a few hearts drift up gently */
        for (var g=0; g<14; g++){
          parts.push({ x:c.x+(Math.random()-.5)*c.w*.6, y:c.cy+(Math.random()-.5)*16,
            vx:(Math.random()-.5)*.16, vy:-(.22+Math.random()*.3), s:6+Math.random()*7,
            life:-g*130, ttl:2500+Math.random()*700, ph:Math.random()*6.28, rot:(Math.random()-.5)*.5,
            spr:sprs[(Math.random()*sprs.length)|0] });
        }
      } else {
        flash={ x:c.x, y:c.cy, t0:now }; ring={ x:c.x, y:c.cy, t0:now };
        for (var i=0;i<82;i++){
          var kind=Math.random(), a=Math.random()*6.283, sp, spr, s;
          if (kind<.55){ spr=sprs[(Math.random()*sprs.length)|0]; sp=.9+Math.random()*2.5; s=5+Math.random()*8; }
          else if (kind<.85){ spr=sparkSpr; sp=1.1+Math.random()*3.2; s=3+Math.random()*5; }
          else { spr=petalSpr; sp=.7+Math.random()*1.5; s=7+Math.random()*6; }
          parts.push({ mode:'blast', x:c.x+(Math.random()-.5)*14, y:c.cy+(Math.random()-.5)*14,
            vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-.55, s:s,
            life:0, ttl:2200+Math.random()*800, ph:Math.random()*6.28,
            rot:Math.random()*6.28, rv:(Math.random()-.5)*.09, spr:spr });
        }
      }
      if (!raf) raf=requestAnimationFrame(frame);
    }
    return {
      start:function(){ if (RM) return; size(); beating=true; lastBeat=performance.now()-900; if (!raf) raf=requestAnimationFrame(frame); },
      burst:function(){ if (RM) return; if (!W) size(); spawn(16,true); if (!raf) raf=requestAnimationFrame(frame); },
      blast:blast,
      stop:function(){ beating=false; }
    };
  })();

  /* ═══ ENDING MUSIC — this page's own music-box melody ═══
     Synthesised with WebAudio in the book's music-box voice (sine +
     octave sparkle, no audio files): an original slow lullaby in a
     high register, notes ringing into each other. It starts on her
     first tap, loops gently under the whole page, fades away as the
     book closes, and leaves ONE final soft chime as the cover
     settles. In the admin phase this block is what gets edited. */
  var ENDING_MUSIC = {
    beat: .58,   // seconds per beat — slow and tender
    melody: [ ['E5',1],['G5',1],['C6',2],['B5',1],['G5',1],
              ['A5',2],['G5',1],['E5',1],['D5',2],[0,1],
              ['E5',1],['G5',1],['A5',2],['G5',1],['E5',1],
              ['D5',1],['E5',1],['C5',3],[0,1],
              ['D5',1],['E5',1],['G5',2],['A5',1],['G5',1],
              ['E5',2],['D5',1],['C5',1],['D5',2],[0,1],
              ['E5',1],['G5',1],['C6',2],['B5',1],['A5',1],
              ['G5',2],['E5',1],['D5',1],['C5',3],[0,2] ],
    chime: 'C6'  // the one final note as the cover settles
  };
  var NOTE = {C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
              C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77, C6:1046.50,
              E6:1318.51, G6:1567.98, C7:2093.00, E7:2637.02};
  var actx=null, endGain=null, endTimer=null, endNext=0, endIdx=0, endStarted=false;
  function endNote(f, t, dur, dest, vol){
    var o1=actx.createOscillator(), o2=actx.createOscillator(), g=actx.createGain(), g2=actx.createGain();
    o1.type='sine'; o1.frequency.value=f; o2.type='sine'; o2.frequency.value=f*2; g2.gain.value=.32;
    var len=Math.max(dur, .9), peak=vol||.15;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+len);
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest || endGain || actx.destination);
    o1.start(t); o2.start(t); o1.stop(t+len+.1); o2.stop(t+len+.1);
  }
  function startEndingMusic(){
    if (endStarted) return; endStarted=true;
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      if (!endGain){ endGain=actx.createGain(); endGain.gain.value=0; endGain.connect(actx.destination); }
      var t0=actx.currentTime;
      endGain.gain.cancelScheduledValues(t0);
      endGain.gain.setValueAtTime(0, t0);
      endGain.gain.linearRampToValueAtTime(.9, t0+1.5);
      endIdx=0; endNext=t0+.12;
      endTimer=setInterval(function(){
        if (!actx) return;
        var now=actx.currentTime;
        while (endNext < now + .6){
          var s=ENDING_MUSIC.melody[endIdx % ENDING_MUSIC.melody.length]; endIdx++;
          var dur=s[1]*ENDING_MUSIC.beat;
          if (s[0]) endNote(NOTE[s[0]], endNext, dur);
          endNext += dur;
        }
      }, 200);
    }catch(e){ /* no audio available — the page still works in silence */ }
  }
  function closeEndingMusic(){
    if (!actx || !endGain) return;
    try{
      var now=actx.currentTime;
      endGain.gain.cancelScheduledValues(now);
      endGain.gain.setValueAtTime(endGain.gain.value, now);
      endGain.gain.linearRampToValueAtTime(0, now+1.3);
      if (endTimer){ var tm=endTimer; endTimer=null; setTimeout(function(){ clearInterval(tm); }, 1500); }
      /* one final soft chime as the cover settles */
      endNote(NOTE[ENDING_MUSIC.chime], now+1.62, 2.4, actx.destination, .12);
    }catch(e){}
  }

  /* At the blast: a soft rising music-box sparkle over the lullaby */
  function blastArpeggio(){
    if (!actx || !endGain) return;
    try{
      var arp=['G5','C6','E6','G6','C7','E7'], t0=actx.currentTime+.03;
      for (var i=0;i<arp.length;i++) endNote(NOTE[arp[i]], t0+i*.065, .6, endGain, .07);
    }catch(e){}
  }

  /* At the blast: a cluster of soft bubble-pops over the music — short
     sine blips with a quick downward pitch glide, like bubbles popping
     in warm water. Warm and quiet, layered over the lullaby through the
     same gain (no ducking). Fires once, in the blast code path. */
  function blastPops(){
    if (!actx) return;
    try{
      var n=6, t0=actx.currentTime+.02;
      for (var i=0;i<n;i++){
        (function(t, f0){
          var o=actx.createOscillator(), g=actx.createGain();
          o.type='sine';
          o.frequency.setValueAtTime(f0, t);
          o.frequency.exponentialRampToValueAtTime(Math.max(140, f0*.32), t+.09);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(.12, t+.008);
          g.gain.exponentialRampToValueAtTime(.0001, t+.13);
          o.connect(g); g.connect(endGain || actx.destination);
          o.start(t); o.stop(t+.16);
        })(t0 + i*(.055+Math.random()*.035) + Math.random()*.012, 620+Math.random()*380);
      }
    }catch(e){}
  }

  /* — The closing sequence: her taps, the great heart, then her hold — */
  var step=0, phase='taps', done=false;
  var lines=[null, document.getElementById('l1'), document.getElementById('l2'), document.getElementById('l3')];
  var goldEl=document.getElementById('gold'), afterEl=document.getElementById('after'),
      heartwrap=document.getElementById('heartwrap');
  setTimeout(function(){ document.getElementById('l0').classList.add('show'); }, 350);

  document.getElementById('page14').addEventListener('pointerdown', function(){
    startEndingMusic();
    if (phase==='end'){ doClose(); return; }
    if (done || phase!=='taps') return;
    step++;
    if (step<=3){ lines[step].classList.add('show'); }
    else if (step===4){
      phase='heart';
      goldEl.classList.add('show'); afterEl.classList.add('show');
      document.getElementById('goldglow').classList.add('on');
      setHint('');
      setTimeout(function(){
        phase='hold';
        heartwrap.classList.add('show');
        risers.start();
        setHint(COPY.hintHold);
      }, 950);
    }
  });

  /* Hold the heart: it fills from pink to gold while she holds */
  var glowEl=document.getElementById('heartglow'), goldHeart=document.getElementById('heartgold'),
      scaleEl=document.getElementById('heartscale');
  var progress=0, holding=false, rafId=null, lastT=0;
  function applyProgress(){
    /* past ~85% the glow races ahead of the charge — the heart feels full to bursting */
    var g = progress>=.85 ? Math.min(1, progress + (progress-.85)*1.6) : progress;
    glowEl.style.opacity = g.toFixed(3);
    goldHeart.style.opacity = progress.toFixed(3);
    scaleEl.style.transform = 'scale(' + (1 + .14*progress).toFixed(3) + ')';
  }
  function holdLoop(t){
    var dt=Math.min(50, t-lastT); lastT=t;
    if (holding) progress=Math.min(1, progress + dt/COPY.holdMs);
    else progress=Math.max(0, progress - dt/(COPY.holdMs*.7));
    applyProgress();
    heartwrap.classList.toggle('charged', holding && progress>=.85 && !RM);
    if (progress>=1 && holding){ finish(); return; }
    if (holding || progress>0) rafId=requestAnimationFrame(holdLoop);
    else rafId=null;
  }
  function startHold(e){
    if (done || phase!=='hold') return;
    e.stopPropagation();
    holding=true; heartwrap.classList.add('holding'); lastT=performance.now();
    if (!rafId) rafId=requestAnimationFrame(holdLoop);
  }
  function endHold(){ holding=false; heartwrap.classList.remove('holding'); heartwrap.classList.remove('charged'); }
  heartwrap.addEventListener('pointerdown', startHold);
  window.addEventListener('pointerup', endHold);
  window.addEventListener('pointercancel', endHold);
  heartwrap.addEventListener('pointerleave', endHold);

  var closeTimer=null;
  function doClose(){
    if (phase==='closed') return;
    phase='closed';
    if (closeTimer){ clearTimeout(closeTimer); closeTimer=null; }
    setHint('');
    risers.stop();
    closeEndingMusic();
    document.getElementById('closer').classList.add('closing');
  }
  function finish(){
    done=true; holding=false; heartwrap.classList.remove('holding'); heartwrap.classList.remove('charged');
    phase='thanks';
    progress=1; applyProgress();
    setHint('');
    blastArpeggio();
    blastPops();
    risers.blast();
    heartwrap.classList.add('blasted');
    setTimeout(function(){
      document.getElementById('thanks').classList.add('show');
      document.getElementById('thanks2').classList.add('show');
    }, COPY.thanksDelayMs);
    setTimeout(function(){
      document.getElementById('theend').classList.add('show');
      document.getElementById('fromline').classList.add('show');
      phase='end';
      setHint(COPY.hintClose);
    }, COPY.thanksDelayMs + 1100);
    closeTimer=setTimeout(doClose, COPY.thanksDelayMs + 1100 + COPY.breathMs);
  }
</script>
</body>
</html>
