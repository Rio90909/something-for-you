<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chapter Six — The Gift Box (demo v5)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:Georgia,'Times New Roman',serif;background:#f6dde4;overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden;background:#f9e3ea}
  #bgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
  .wash{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,244,247,.20),rgba(255,244,247,0) 30%,rgba(249,227,234,0) 62%,rgba(243,207,219,.45));z-index:1}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(190,120,145,.16));z-index:1}
  .lamp{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,214,140,.5),rgba(255,214,140,0) 68%);z-index:1;animation:glowPulse 5s ease-in-out infinite}
  .lamp.l1{width:340px;height:340px;left:-110px;top:6%}
  .lamp.l2{width:280px;height:280px;right:-90px;top:24%;animation-delay:1.6s}
  .lamp.l3{width:220px;height:220px;left:8%;bottom:8%;animation-delay:3s}
  @keyframes glowPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.07)}}
  #header{position:absolute;top:0;left:0;right:0;z-index:5;text-align:center;padding-top:calc(18px + env(safe-area-inset-top));pointer-events:none}
  #header .kick{font-family:Verdana,sans-serif;font-size:9.5px;letter-spacing:.34em;color:#b06a82;text-transform:uppercase}
  #header h1{font-family:'Brush Script MT','Segoe Script',cursive;font-weight:400;font-size:41px;color:#a63d5f;margin-top:2px;text-shadow:0 2px 14px rgba(255,255,255,.75)}
  #header .sub{font-style:italic;font-size:14.5px;color:#96606f;margin-top:1px}
  #scene{position:absolute;left:50%;bottom:96px;width:340px;height:262px;transform-origin:50% 100%;z-index:3}
  .floor{position:absolute;left:50%;bottom:20px;width:270px;height:40px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(146,84,104,.30),rgba(146,84,104,0) 68%);border-radius:50%}
  #boxStack{position:absolute;left:50%;bottom:34px;width:300px;height:215px;transform:translateX(-50%)}
  #boxStack.wiggle{animation:wig .38s ease}
  @keyframes wig{0%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-1.6deg)}55%{transform:translateX(-50%) rotate(1.4deg)}100%{transform:translateX(-50%) rotate(0)}}
  #kittenWrap{position:absolute;left:50%;bottom:56px;width:232px;height:232px;z-index:1;transform:translate(-50%,86%) scale(.92);opacity:0;transition:transform .75s cubic-bezier(.34,1.45,.64,1),opacity .5s}
  #kittenWrap.in{transform:translate(-50%,0) scale(1);opacity:1}
  #kittenWrap.out{transform:translate(-50%,38%) scale(1.32);opacity:1;z-index:5}
  #kittenInner{position:absolute;inset:0;transition:transform .45s ease}
  #kittenInner.listen{transform:rotate(-3.5deg)}
  #kittenInner.react{animation:reactB .8s cubic-bezier(.34,1.56,.64,1)}
  @keyframes reactB{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-13px) scale(1.05) rotate(-2deg)}55%{transform:translateY(0) scale(.98)}75%{transform:translateY(-6px) scale(1.02)}100%{transform:translateY(0) scale(1)}}
  /* photo kitten (v3 layer): head-only sway — photo + lids + mouth + hat move as ONE unit inside #sway */
  #sway{position:absolute;inset:0;transform-origin:50% 88%;animation:headSway 6.5s ease-in-out infinite alternate}
  @keyframes headSway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
  @media (prefers-reduced-motion: reduce){#sway{animation:none}}
  #kittenImg{width:100%;height:100%;display:block;-webkit-mask-image:radial-gradient(ellipse 71% 67% at 50% 45%,#000 44%,transparent 93%);mask-image:radial-gradient(ellipse 71% 67% at 50% 45%,#000 44%,transparent 93%)}
  .lidEye{position:absolute;width:15%;height:12%;border-radius:50%;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 22%,#fdf6f1 0%,#f3e3db 58%,#e7cfc2 100%);box-shadow:inset 0 -4px 5px rgba(166,120,106,.55),inset 0 2px 3px rgba(255,255,255,.7);transform:scaleY(0);transform-origin:50% 0}
  #lidL{left:33%;top:32.6%;--r:-4deg}
  #lidR{left:51%;top:31.1%;--r:4deg}
  .lidEye.blink{animation:blk .38s ease-in-out}
  @keyframes blk{0%{transform:scaleY(0) rotate(var(--r))}36%{transform:scaleY(1) rotate(var(--r))}64%{transform:scaleY(1) rotate(var(--r))}100%{transform:scaleY(0) rotate(var(--r))}}
  #mouth{position:absolute;left:50%;top:46%;width:6.4%;height:3.8%;border-radius:50%;z-index:3;background:#c06a80;opacity:.85;transform:translate(-50%,-50%) scaleY(.22)}
  #kittenInner.talking #mouth{animation:mtalk .17s ease-in-out infinite alternate}
  @keyframes mtalk{from{transform:translate(-50%,-50%) scaleY(.22)}to{transform:translate(-50%,-50%) scaleY(1)}}
  .hat{position:absolute;left:46.5%;top:-.5%;width:15.5%;transform:rotate(7deg);z-index:4;filter:drop-shadow(0 2px 2px rgba(160,110,40,.35))}
  .sideHeart{position:absolute;left:77%;top:50%;width:13.5%;z-index:3;animation:floaty 2.8s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
  #bodyImg{position:absolute;left:0;bottom:0;width:300px;height:115px;z-index:2;display:block;transition:opacity .55s ease,transform .55s ease}
  #lidWrap{position:absolute;left:0;top:0;width:300px;height:105px;z-index:3;transition:transform .8s cubic-bezier(.5,0,.8,.4),opacity .8s}
  #lidWrap.open{transform:translateY(-84px) rotate(-10deg);opacity:0}
  #lidWrap.shake{animation:shk .45s ease}
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-4.5px)}45%{transform:translateX(4px)}70%{transform:translateX(-3px)}90%{transform:translateX(1.5px)}}
  .lidImg{position:absolute;inset:0;width:300px;height:105px;display:block}
  #lidNB{opacity:0;transition:opacity .45s}
  #lidNB.show{opacity:1}
  #bowLayer{position:absolute;left:28.3%;top:4.7%;width:44%;height:95.3%;display:block;transition:transform .7s cubic-bezier(.5,0,.8,.4),opacity .7s;transform-origin:50% 20%}
  #bowLayer.loose1{transform:rotate(-4deg) translateY(1.5px)}
  #bowLayer.loose2{transform:rotate(5.5deg) translateY(4px) scale(.97)}
  #bowLayer.free{transform:translateY(150px) rotate(42deg);opacity:0}
  #crack{position:absolute;left:6%;top:101px;width:88%;height:5px;z-index:2;border-radius:3px;background:linear-gradient(90deg,transparent,#ffd968 30%,#fff3b0 50%,#ffd968 70%,transparent);opacity:0;transform:scaleX(.3);transition:opacity .3s,transform .3s}
  #crack.show{opacity:.95;transform:scaleX(.62)}
  #glow{position:absolute;left:50%;top:38px;width:300px;height:150px;z-index:2;pointer-events:none;transform:translateX(-50%) scale(.4);opacity:0;background:radial-gradient(ellipse at center,rgba(255,214,110,.85),rgba(255,190,120,.35) 45%,rgba(255,190,120,0) 70%);transition:opacity .55s,transform .55s}
  #glow.show{opacity:1;transform:translateX(-50%) scale(1.15)}
  #scene.boxgone #bodyImg{opacity:0;transform:translateY(30px)}
  #scene.boxgone #crack{opacity:0}
  .hot{position:absolute;background:transparent;border:0;cursor:pointer;z-index:6}
  #knotBtn{left:33%;top:-14px;width:34%;height:86px}
  #lidBtn{left:2%;top:0;width:96%;height:104px;display:none}
  #heartsCv{position:absolute;inset:0;z-index:6;pointer-events:none}
  #burst{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
  .pt{position:absolute;font-style:normal;line-height:1}
  .bheart{position:absolute;font-style:normal;will-change:transform,opacity;animation:bFly 1.05s cubic-bezier(.17,.67,.35,1) forwards}
  @keyframes bFly{0%{transform:translate(0,0) scale(.5) rotate(0deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.12) rotate(var(--rot));opacity:0}}
  #bubble{position:absolute;left:50%;bottom:calc(96px + 262px * var(--s,1) + 6px);transform:translateX(-50%) translateY(8px);pointer-events:none;width:min(84vw,320px);background:#fffdf7;color:#7c4356;font-size:16.5px;line-height:1.45;font-style:italic;text-align:center;padding:13px 17px 14px;border-radius:20px;box-shadow:0 10px 26px rgba(160,90,115,.22);opacity:0;transition:opacity .35s,transform .35s;z-index:8}
  #bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:10px solid transparent;border-top-color:#fffdf7;border-bottom:0}
  #hint{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));text-align:center;font-style:italic;font-size:14.5px;color:#a06a7c;z-index:5;pointer-events:none;padding:0 30px}
  #chatRow{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(92vw,360px);z-index:9;display:none;gap:8px}
  #chatRow.show{display:flex}
  #chatIn{flex:1;border:2px solid #eec3d0;background:#fffdf9;border-radius:999px;padding:11px 17px;font-family:Georgia,serif;font-size:15.5px;color:#7c4356;outline:none;min-width:0}
  #chatIn:focus{border-color:#e2709a}
  #sendBtn{border:0;border-radius:999px;background:linear-gradient(135deg,#ef7fa8,#e0508a);color:#fff;font-family:Verdana,sans-serif;font-size:11px;letter-spacing:.14em;padding:0 19px;cursor:pointer}
  #pgnum{position:absolute;right:18px;bottom:calc(16px + env(safe-area-inset-bottom));font-family:Verdana,sans-serif;font-size:10px;letter-spacing:.22em;color:#b98a99;z-index:5}
</style>
</head>

<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var stage=$("stage"), scene=$("scene"), stack=$("boxStack"), lidWrap=$("lidWrap"), bow=$("bowLayer"),
    lidNB=$("lidNB"), crack=$("crack"), glow=$("glow"), kitten=$("kittenWrap"), inner=$("kittenInner"),
    bubble=$("bubble"), hint=$("hint"), knotBtn=$("knotBtn"), lidBtn=$("lidBtn"),
    chatRow=$("chatRow"), chatIn=$("chatIn"), sendBtn=$("sendBtn"), burst=$("burst");

/* =====================================================================
   OPENING LINE — Shaheer: these are Mimi's very first words when the
   box opens. Edit this one line to change them. (No "Princess" here —
   her opening words are meant to feel like they belong to her alone.)
   ===================================================================== */
var OPENING_LINE = "Hello, beautiful soul. It's me — your little kitten. I waited inside this box just for you… and from today, I will talk with you every single day.";

/* ---------------- scene scaler ---------------- */
function fit(){
  var w=stage.clientWidth, h=stage.clientHeight;
  var s=Math.min(w/356,(h-300)/300);
  s=Math.max(.82,Math.min(1.8,s));
  scene.style.transform="translateX(-50%) scale("+s+")";
  scene.style.setProperty("--s",s);
  bubble.style.setProperty("--s",s);
  document.documentElement.style.setProperty("--s",s);
  if(window.__heartsResize) window.__heartsResize();
}
window.addEventListener("resize",fit);

/* ---------------- voice (the phone's own speech) ---------------- */
var synth=window.speechSynthesis||null, chosenVoice=null, voicesTried=false;
function pickVoice(){
  if(!synth) return;
  var vs=[]; try{ vs=synth.getVoices()||[]; }catch(e){}
  if(!vs.length) return;
  voicesTried=true;
  var en=vs.filter(function(v){return /^en([-_]|$)/i.test(v.lang||"");});
  var pool=en.length?en:vs;
  chosenVoice=pool.filter(function(v){return /female|zira|samantha|aria|jenny|google us english/i.test(v.name||"");})[0]||pool[0];
}
if(synth){ pickVoice(); if(synth.addEventListener) synth.addEventListener("voiceschanged",pickVoice); }

/* ---------------- photo kitten: blinking (v3 eyelids) ----------------
   Her head sway lives in CSS on #sway, so the photo, eyelids, mouth and
   hat all ride the same gentle tilt as one unit — no drift, no breathing. */
var speaking=false, listening=false, opened=false, pos="in";
var lidL=$("lidL"), lidR=$("lidR"), alive=false;
function doBlink(){
  [lidL,lidR].forEach(function(l){ if(!l) return; l.classList.remove("blink"); void l.offsetWidth; l.classList.add("blink"); });
}
[lidL,lidR].forEach(function(l){ if(l) l.addEventListener("animationend",function(){ l.classList.remove("blink"); }); });
function scheduleBlink(){
  if(!alive) return;
  setTimeout(function(){
    if(!alive) return;
    doBlink();
    if(Math.random()<0.20){ setTimeout(doBlink,330); }        /* the odd double-blink */
    scheduleBlink();
  },2100+Math.random()*3300);
}

/* ---------------- speaking ---------------- */
var talkTimer=null, speakSeq=0;
function endSpeak(seq){ if(seq!==speakSeq) return; speaking=false; inner.classList.remove("talking"); }
function speak(text){
  bubble.textContent=text; bubble.classList.add("show");
  speaking=true; inner.classList.add("talking");
  var seq=++speakSeq;
  clearTimeout(talkTimer);
  var dur=Math.min(9500,Math.max(1700,text.length*80));
  talkTimer=setTimeout(function(){ endSpeak(seq); },dur);
  if(!synth) return;
  if(!chosenVoice && !voicesTried) pickVoice();
  try{
    var u=new SpeechSynthesisUtterance(text);
    u.pitch=1.9; u.rate=0.97;                 /* her cute small voice — do not change */
    if(chosenVoice) u.voice=chosenVoice;
    u.onend=function(){ endSpeak(seq); };
    u.onerror=function(){ endSpeak(seq); };
    synth.cancel(); synth.speak(u); synth.resume();
  }catch(e){}
}

/* ---------------- hearts in the air ---------------- */
var hearts=(function(){
  var cv=$("heartsCv"); if(!cv||!cv.getContext) return {start:function(){},resize:function(){}};
  var ctx=cv.getContext("2d");
  var W=0,H=0,parts=[],raf=0,running=false,wasRunning=false;
  var PRM=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var COLS=["#f7a8c4","#f28bb4","#e95d8f"];
  var sprites=COLS.map(function(col){
    var c=document.createElement("canvas"); c.width=c.height=48; var g=c.getContext("2d");
    g.fillStyle=col; g.beginPath(); g.moveTo(24,42);
    g.bezierCurveTo(6,28,3,18,8,10); g.bezierCurveTo(12,4,21,6,24,14);
    g.bezierCurveTo(27,6,36,4,40,10); g.bezierCurveTo(45,18,42,28,24,42); g.fill();
    return c;
  });
  function resize(){ var r=stage.getBoundingClientRect(); W=cv.width=Math.max(1,Math.round(r.width)); H=cv.height=Math.max(1,Math.round(r.height)); }
  function spawn(anywhere){ return { x:Math.random()*Math.max(1,W), y:anywhere?Math.random()*Math.max(1,H):H+18,
    s:9+Math.random()*13, v:.22+Math.random()*.35, ph:Math.random()*6.283, sw:.3+Math.random()*.7,
    a:.32+Math.random()*.4, sp:sprites[(Math.random()*sprites.length)|0] }; }
  function frame(ts){
    if(!running) return;
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){ var p=parts[i];
      p.y-=p.v; p.x+=Math.sin(ts/1700+p.ph)*p.sw*.4;
      if(p.y<-22){ parts[i]=spawn(false); continue; }
      ctx.globalAlpha=p.a; ctx.drawImage(p.sp,p.x-p.s/2,p.y-p.s/2,p.s,p.s);
    }
    ctx.globalAlpha=1;
    raf=requestAnimationFrame(frame);
  }
  function start(){ if(running||PRM) return; resize();
    if(!parts.length){ for(var i=0;i<14;i++) parts.push(spawn(true)); }
    running=true; raf=requestAnimationFrame(frame); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); ctx.clearRect(0,0,W,H); }
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ wasRunning=running; stop(); }
    else if(wasRunning){ wasRunning=false; start(); }
  });
  window.__heartsResize=function(){ if(running) resize(); };
  return { start:start, resize:resize };
})();

/* ---------------- little celebrations ---------------- */
var HEARTS=["\uD83E\uDE77","\u2764\uFE0F","\uD83D\uDC97","\u2728"];
function spawnBurst(cx,cy,n){
  for(var i=0;i<n;i++){
    var s=document.createElement("i"); s.className="bheart";
    s.textContent=HEARTS[(Math.random()*HEARTS.length)|0];
    var ang=Math.random()*Math.PI*2, dist=52+Math.random()*86;
    s.style.left=cx+"px"; s.style.top=cy+"px";
    s.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    s.style.setProperty("--dy",(Math.sin(ang)*dist-44)+"px");
    s.style.setProperty("--rot",((Math.random()*70)-35)+"deg");
    s.style.fontSize=(13+Math.random()*13)+"px";
    burst.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); },1150); })(s);
  }
}
function popHearts(){ var r=kitten.getBoundingClientRect(); spawnBurst(r.left+r.width/2,r.top+r.height*.3,7); }
function bigBurst(){ var r=kitten.getBoundingClientRect(); spawnBurst(r.left+r.width/2,r.top+r.height*.35,16); }
function react(){ inner.classList.remove("react"); void inner.offsetWidth; inner.classList.add("react"); popHearts(); }

/* ---------------- the box: tap-struggle opening (v3 sequence, restored exactly) ---------------- */
var ribbonTaps=0, lidTaps=0;
function setHint(t){ hint.textContent=t; }
function openBurst(){
  for(var i=0;i<14;i++){
    var sp=document.createElement("span");
    sp.className="pt"; sp.textContent=(i%3===0)?"♥":"✦";
    sp.style.left="50%"; sp.style.top="30%";
    sp.style.fontSize=(10+Math.random()*11)+"px";
    sp.style.color=(i%3===0)?"#e05d8d":"#d9a52e";
    burst.appendChild(sp);
    var ang=(i/14)*Math.PI*2 + Math.random()*.4, dist=70+Math.random()*85;
    var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist*.8-26;
    sp.animate([
      {transform:"translate(-50%,-50%) scale(.5)", opacity:0},
      {transform:"translate(calc(-50% + "+(dx*.6)+"px), calc(-50% + "+(dy*.6)+"px)) scale(1.1)", opacity:1, offset:.3},
      {transform:"translate(calc(-50% + "+dx+"px), calc(-50% + "+dy+"px)) scale(.8)", opacity:0}
    ],{duration:1050+Math.random()*400, easing:"cubic-bezier(.2,.7,.3,1)"});
    (function(el){ setTimeout(function(){ el.remove(); },1600); })(sp);
  }
}
function advanceRibbon(){
  if(opened) return;
  ribbonTaps++;
  stack.classList.remove("wiggle"); void stack.offsetWidth; stack.classList.add("wiggle");
  if(ribbonTaps===1){ bow.classList.add("loose1"); setHint("It's tied so tight… tap again, anywhere!"); }
  else if(ribbonTaps===2){ bow.classList.add("loose2"); setHint("It's slipping — one more tap!"); }
  else if(ribbonTaps>=3){
    bow.classList.add("free"); lidNB.classList.add("show");
    knotBtn.style.display="none"; lidBtn.style.display="block";
    setHint("The ribbon is free! Now tap the lid…");
  }
}
function advanceLid(){
  if(opened) return;
  lidTaps++;
  if(lidTaps===1){
    lidWrap.classList.remove("shake"); void lidWrap.offsetWidth; lidWrap.classList.add("shake");
    crack.classList.add("show");
    setHint("The lid is stuck — tap again, don't give up!");
  } else if(lidTaps>=2){ openBox(); }
}
function tapGift(){
  if(opened) return;
  if(ribbonTaps<3){ advanceRibbon(); } else { advanceLid(); }
}
stage.addEventListener("click",function(e){
  if(e.target===chatIn||e.target===sendBtn) return;
  tapGift();
});
stage.addEventListener("dblclick",function(){
  if(opened) return;
  bow.classList.add("free"); lidNB.classList.add("show"); crack.classList.add("show");
  ribbonTaps=3; openBox();
});
knotBtn.addEventListener("click",function(e){ e.stopPropagation(); tapGift(); });
lidBtn.addEventListener("click",function(e){ e.stopPropagation(); tapGift(); });

function openBox(){
  if(opened) return;
  opened=true; pos="in";
  lidBtn.style.display="none"; knotBtn.style.display="none";
  lidWrap.classList.add("open");
  glow.classList.add("show");
  openBurst();
  setTimeout(function(){ glow.classList.remove("show"); },1400);
  setTimeout(function(){
    kitten.classList.add("in");
    alive=true; scheduleBlink();
    hearts.start();
    chatRow.classList.add("show");
    setHint("She's yours now — say hello to her!");
  },260);
  setTimeout(function(){ speak(OPENING_LINE); },800);
}

/* ---------------- out of the box / back inside ---------------- */
function jumpOut(line){
  if(pos==="out"){ speak(line); return; }
  pos="out";
  var anim=kitten.animate([
    { transform:"translate(-50%,0) scale(1)" },
    { transform:"translate(-50%,-52%) scale(1.14)", offset:.42 },
    { transform:"translate(-50%,38%) scale(1.32)" }
  ],{ duration:760, easing:"cubic-bezier(.34,1.4,.64,1)", fill:"forwards" });
  scene.classList.add("boxgone");
  setTimeout(bigBurst,430);
  speak(line);
  anim.onfinish=function(){ kitten.classList.add("out"); anim.cancel(); };
}
function jumpIn(line){
  if(pos==="in"){ speak(line); return; }
  pos="in";
  scene.classList.remove("boxgone");
  var anim=kitten.animate([
    { transform:"translate(-50%,38%) scale(1.32)" },
    { transform:"translate(-50%,-46%) scale(1.12)", offset:.45 },
    { transform:"translate(-50%,0) scale(1)" }
  ],{ duration:700, easing:"cubic-bezier(.34,1.4,.64,1)", fill:"forwards" });
  speak(line);
  anim.onfinish=function(){ kitten.classList.remove("out"); anim.cancel(); popHearts(); };
}
kitten.addEventListener("click",function(e){ if(opened){ e.stopPropagation(); react(); } });

/* ---------------- chatting with her ---------------- */
var MB=window.MIMI_BRAIN||null;
function sendMsg(){
  var v=chatIn.value.trim(); if(!v) return;
  chatIn.value=""; updListen();
  if(!MB){ speak("I am here, I am here! My words are still travelling — ask me again in a moment."); return; }
  var res=MB.reply(v);
  if(res.cmd==="out") jumpOut(res.text);
  else if(res.cmd==="in") jumpIn(res.text);
  else { speak(res.text); if(/dance|yay|love|somersault/i.test(res.text)) react(); }
}
sendBtn.addEventListener("click",sendMsg);
chatIn.addEventListener("keydown",function(e){ if(e.key==="Enter") sendMsg(); });
function updListen(){
  var l=(document.activeElement===chatIn)||chatIn.value.length>0;
  if(l!==listening){ listening=l; inner.classList.toggle("listen",l); }
}
chatIn.addEventListener("focus",updListen);
chatIn.addEventListener("input",updListen);
chatIn.addEventListener("blur",function(){ setTimeout(updListen,60); });

window.__mimiSpeak=speak; window.__mimiReact=react;
fit();
})();
</script>
